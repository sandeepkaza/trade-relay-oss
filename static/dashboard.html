<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RelayBot</title>
<script>
// Theme bootstrap — runs before paint to avoid flash-of-wrong-theme.
// Stored per-device (localStorage), so each person/browser keeps their own
// preference: dark for one viewer, light for another. Falls back to OS pref.
(function(){try{
  var t=localStorage.getItem('rb_theme');
  if(t!=='light'&&t!=='dark'){
    t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  }
  document.documentElement.setAttribute('data-theme',t);
}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<style>
:root{
  --bg:#090c12;--surface:#111520;--border:#1e2538;--border2:#2a3350;
  --text:#d8e0f0;--muted:#5a6890;--dim:#2a3350;
  --green:#22d47a;--gbg:#0d2a1c;--gbd:#155c34;
  --red:#f04060;  --rbg:#2a0d14;--rbd:#5c1525;
  --amber:#f0a030;--abg:#2a1c08;--abd:#5c3c10;
  --blue:#4090f0; --bbg:#0d1a2a;--bbd:#154060;
  --r:6px;--rl:10px;
}
/* Light theme — applied when <html data-theme="light">. Same semantic vars,
   re-tuned for a bright background so all components flip with no per-element
   changes. Per-device via localStorage (see head bootstrap + header toggle). */
:root[data-theme=light]{
  /* Tabler admin theme (github.com/tabler/tabler) — exact tokens.
     Cool slate-grey neutrals, white cards, gray-200 borders, gray-800 text. */
  --bg:#f9fafb;--surface:#ffffff;--border:#e5e7eb;--border2:#d1d5db;
  --text:#1f2937;--muted:#6b7280;--dim:#d1d5db;
  /* #2fb344 measured 2.67:1 against the white surface — under the 3:1 floor
     for non-text marks, so green chart fills and P&L figures were the weakest
     thing on the light theme. #15803d is the nearest step that clears it
     (validated: contrast PASS, normal-vision ΔE 29.9 vs --red, protan 7.9 —
     inside the floor band, which the charts satisfy because sign is also
     encoded by position above/below the zero line). Dark theme is unchanged;
     its green already passes. */
  --green:#15803d;--gbg:#eaf7ec;--gbd:#abe1b4;
  --red:#d63939;  --rbg:#f9e0e0;--rbd:#efb0b0;
  --amber:#ad6800;--abg:#fdeccc;--abd:#fbd899;
  --blue:#066fd1; --bbg:#e7f1fb;--bbd:#9bc5ed;
}
:root[data-theme=light] .ht,
:root[data-theme=light] .tab.active,
:root[data-theme=light] .pt{color:#111827}
:root[data-theme=light] .raw{color:#1f2937}
/* Tabler card depth: hairline border + very soft shadow (raised, not flat). */
:root[data-theme=light] .pc,
:root[data-theme=light] .sc{box-shadow:rgba(31,41,55,.04) 0 2px 4px 0,rgba(31,41,55,.03) 0 1px 1px 0}
:root[data-theme=light] .exit-all-bar{box-shadow:rgba(31,41,55,.04) 0 2px 4px 0}
:root[data-theme=light] .header{border-bottom-color:var(--border2)}
:root[data-theme=light] ::-webkit-scrollbar-thumb{background:#cbd0d6}
html{color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
/* Uniform theme flip: a temporary class on <html> animates EVERY element's
   colors together for the ~220ms of the toggle, then is removed — so the whole
   page crossfades as one instead of snapping element-by-element. No transition
   at any other time (avoids initial-load animation + hover jank). */
html.theme-anim,html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{
  transition:background-color .22s ease,border-color .22s ease,color .22s ease,fill .22s ease,box-shadow .22s ease!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.mono{font-family:'SF Mono','Fira Code','Consolas',monospace}
#app{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.header{display:flex;align-items:center;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.ht{font-size:15px;font-weight:600;color:#fff}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-g{background:var(--green);animation:pulse 2s infinite}
.dot-r{background:var(--red)}
.dot-a{background:var(--amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sl{font-size:12px;color:var(--muted)}
.btn{background:transparent;border:1px solid var(--border2);color:var(--text);padding:5px 12px;border-radius:var(--r);cursor:pointer;font-size:12px;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{border-color:var(--rbd);color:var(--red);background:var(--rbg)}
.btn-danger:hover{border-color:var(--red);background:var(--rbg)}
.btn-danger:disabled{opacity:.4}
.btn-amber{border-color:var(--abd);color:var(--amber);background:var(--abg)}
/* Position action bar — its own row under the P&L summary so the header stays
   clean and the controls don't fight two margin-left:auto siblings. */
.pa{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 2px}
.pa .pa-sp{flex:1 1 12px}
.btn-sm{font-size:11px;padding:4px 11px;border-radius:var(--r);font-weight:500;
  line-height:1.2;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}
/* Compact state-aware toggle pill (PTs / BE lock) */
.pill-tgl{cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);
  transition:border-color .15s,color .15s,background .15s}
.pill-tgl.on{border-color:var(--gbd);color:var(--green);background:var(--gbg)}
.pill-tgl.off{border-color:var(--abd);color:var(--amber);background:transparent}
.pill-tgl:hover:not(:disabled){filter:brightness(1.15)}
/* Primary destructive action — bigger tap target than the old cramped buttons */
.btn-exit{border-color:var(--rbd);color:#fff;background:var(--red);font-weight:600;padding:5px 14px}
.btn-exit:hover:not(:disabled){filter:brightness(1.08)}
.sbar{display:flex;gap:24px;padding:10px 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;align-items:center}
.si{display:flex;flex-direction:column;gap:2px}
.sl2{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sv{font-size:14px;font-weight:600;font-family:'SF Mono',monospace}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;font-size:13px;cursor:pointer;background:transparent;border:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px;transition:color .15s;white-space:nowrap;flex:0 0 auto}
.tab:hover{color:var(--text)}
.tab.active{color:#fff;border-bottom-color:var(--blue);font-weight:500}
.tbdg{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--bbg);color:var(--blue);border:1px solid var(--bbd);font-family:monospace;font-weight:600;min-width:16px;text-align:center}
.tab.active .tbdg{background:var(--blue);color:#fff;border-color:var(--blue)}
.tbdg-alert{background:var(--abg,#3a2e00);color:var(--amber);border-color:var(--amber)}
.tab.active .tbdg-alert{background:var(--amber);color:#000;border-color:var(--amber)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;border-width:1px;border-style:solid;letter-spacing:.03em}
.bg{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.br{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.ba{background:var(--abg);color:var(--amber);border-color:var(--abd)}
.bb{background:var(--bbg);color:var(--blue);border-color:var(--bbd)}
.bd{background:var(--surface);color:var(--muted);border-color:var(--border)}
.ar{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);transition:background .3s}
.ar.flash{animation:rowfl 1.2s ease}
@keyframes rowfl{0%,100%{background:transparent}40%{background:#0d2a1c}}
.raw{font-family:'SF Mono',monospace;font-size:12px;font-weight:500;color:#e8efff}
.meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.ch-pill{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--bbg);color:var(--blue);border:1px solid var(--bbd);font-family:monospace}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px;
  transition:transform .12s ease,box-shadow .12s ease,border-color .15s,background-color .2s}
.pc:hover{border-color:var(--border2);box-shadow:0 4px 18px rgba(0,0,0,.22);transform:translateY(-1px)}
:root[data-theme=light] .pc:hover{box-shadow:rgba(31,41,55,.10) 0 6px 16px 0,rgba(31,41,55,.06) 0 2px 6px 0}
.pc.win{border-left:3px solid var(--green)}
.pc.loss{border-left:3px solid var(--red)}
.pc.flat{border-left:3px solid var(--border2)}
/* Price feed dead (>10s no tick): red ring — the P&L on this card is lying. */
.pc.stale{border-color:var(--rbd);background:var(--rbg)}
/* Order pending >60s: pulse — possible stuck re-peg / dead broker session. */
@keyframes stuckpulse{0%,100%{background:var(--abg)}50%{background:var(--rbg)}}
tr.stuck{animation:stuckpulse 1.6s ease-in-out infinite}
/* Compact one-line book summary + inline sort (replaces bulky KPI cards) */
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-bottom:10px;font-size:12px}
.pbar-l{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pbar-sort{display:flex;align-items:center;gap:4px}
.sortb{font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.sortb.active{background:var(--bbg);border-color:var(--bbd);color:var(--blue);font-weight:600}
.sortb:hover:not(.active){border-color:var(--border2);color:var(--text)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pt{font-size:15px;font-weight:600;font-family:monospace;color:#fff}
.pm{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-family:monospace}
.eb-wrap{position:relative;margin:22px 0 28px;height:6px}
.et{width:100%;height:6px;background:var(--border);border-radius:3px;position:relative;overflow:visible}
.em{position:absolute;top:-20px;transform:translateX(-50%);text-align:center}
.el{font-size:10px;font-family:monospace}
.ei{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:1px;height:6px}
.es{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap;font-family:monospace}
.exit-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:10px;font-family:monospace;border-width:1px;border-style:solid;margin:2px}
.ot{width:100%;border-collapse:collapse;font-size:12px;font-family:monospace}
.ot th{padding:8px 10px;text-align:left;color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--border2)}
.ot td{padding:9px 10px;border-bottom:1px solid var(--border)}
.ot tr:hover td{background:var(--surface)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.sg3{grid-template-columns:repeat(3,1fr)} /* top-3 analyst podium */
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.nbox{margin-bottom:10px}
.notif{padding:10px 14px;border-radius:var(--r);font-size:12px;border-width:1px;border-style:solid;margin-bottom:7px;animation:nfi .3s ease}
@keyframes nfi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.ng{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.nr{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.na{background:var(--abg);color:var(--amber);border-color:var(--abd)}
.nb{background:var(--bbg);color:var(--blue);border-color:var(--bbd)}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
.ctt{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:8px 12px;font-family:monospace;font-size:12px;color:var(--text)}
.exit-all-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--rbg);border:1px solid var(--rbd);border-radius:var(--r);margin-bottom:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px}
/* ── Settings tab ─────────────────────────────────── */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:20px}
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px}
.settings-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:12px;color:var(--text);flex:1;min-width:0}
.settings-desc{font-size:10px;color:var(--muted);margin-top:1px}
.settings-input{background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:4px;padding:4px 8px;font-size:12px;font-family:'SF Mono',monospace;width:88px;text-align:right;outline:none;transition:border-color .15s}
.settings-input:focus{border-color:var(--blue)}
.settings-input.wide{width:160px;text-align:left}
.toggle{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border2);border-radius:20px;transition:.2s}
.toggle-slider:before{position:absolute;content:'';height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.toggle-slider{background:var(--blue)}
input:checked+.toggle-slider:before{transform:translateX(16px)}
.save-bar{display:flex;align-items:center;gap:10px;padding:12px 0 0;margin-top:6px;border-top:1px solid var(--border)}
.save-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r);padding:7px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.save-btn:disabled{opacity:.4;cursor:not-allowed}
.save-status-ok{color:var(--green);font-size:12px;font-weight:500}
.save-status-err{color:var(--red);font-size:12px;font-weight:500}
/* Horizontal-scroll wrapper for wide grids/tables on small screens. */
.xscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Position-card metric strip (Entry → Now → Peak → P&L → Qty → Time).
   Layout lives here (not inline) so the phone breakpoint can reflow it;
   only the win/loss border color stays inline. */
.pmx{display:flex;align-items:center;gap:10px;margin:8px 0 4px;padding:8px 12px;
  background:var(--bg);border-radius:6px;border:1px solid var(--border)}
.pmx-div{width:1px;height:32px;background:var(--border);margin:0 4px}
/* Analyst drilldown: per-stock P&L | trade log */
.adg{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;align-items:start}
/* ── Phone breakpoint (iPhone). iPad stays desktop-width. ─────────────── */
@media (max-width:600px){
  #app{padding:0 10px 32px}
  .header{padding:10px 0 8px;gap:8px}
  .ht{font-size:14px}
  /* Summary bar: tidy grid instead of ragged flex wrap */
  .sbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px 12px;padding:8px 0 10px}
  .sl2{font-size:9px}
  .sv{font-size:13px}
  .tab{padding:9px 12px;font-size:12px}
  /* Tables: smaller type + tighter cells, scroll horizontally via .xscroll */
  .ot{font-size:11px}
  .ot th{padding:6px 7px;font-size:10px}
  .ot td{padding:7px 7px}
  /* Stat-card grids pack tighter so 2 fit per row */
  .sg{grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  .sc{padding:11px}
  .settings-grid{grid-template-columns:1fr}
  .empty{padding:2rem 1rem}
  /* Metric strip wraps into two rows instead of overflowing the card */
  .pmx{flex-wrap:wrap;justify-content:space-between;gap:8px 14px;padding:8px 10px}
  .pmx-div{display:none}
  /* Analyst drilldown stacks: stock list above trade log */
  .adg{grid-template-columns:1fr;gap:14px}
  /* 16px stops iOS Safari auto-zooming the page on input focus */
  .settings-input{font-size:16px}
  /* Bigger thumb targets */
  .btn-sm{padding:7px 12px}
  .sortb{padding:4px 12px}
  .pill-tgl{padding:6px 11px}
  /* Analyst podium stacks vertically */
  .sg3{grid-template-columns:1fr}
  /* ExitBar PT/SL labels: smaller so 4 markers don't collide on a narrow track */
  .el{font-size:9px}
  .es{font-size:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const {useState,useEffect,useRef,useCallback}=React;
const {AreaChart,Area,BarChart,Bar,Cell,XAxis,YAxis,Tooltip,ResponsiveContainer,ReferenceLine}=Recharts;
const {createRoot}=ReactDOM;

const isHttp=/^https?:$/i.test(window.location.protocol);
const API=isHttp?window.location.origin:"http://localhost:8000";
const WS=isHttp
  ?`${window.location.protocol==="https:"?"wss":"ws"}://${window.location.host}/ws`
  :"ws://localhost:8000/ws";

// ── App-layer API key (defense-in-depth behind Cloudflare Access) ─────────────
// Mutating endpoints require X-API-Key matching DASHBOARD_API_KEY on the server.
// Stored once per device in localStorage; attached to every /api request below.
const getApiKey=()=>{try{return localStorage.getItem('dash_api_key')||''}catch(e){return''}};
const setApiKey=k=>{try{k?localStorage.setItem('dash_api_key',k):localStorage.removeItem('dash_api_key')}catch(e){}};
const promptApiKey=()=>{const cur=getApiKey();const k=window.prompt('Dashboard API key (needed to place/cancel/exit trades & change settings):',cur);if(k!==null)setApiKey(k.trim());return getApiKey();};
// Wrap fetch so the key rides along on same-app /api calls automatically.
const _origFetch=window.fetch.bind(window);
window.fetch=(input,init)=>{
  init=init||{};
  try{
    const url=typeof input==='string'?input:(input&&input.url)||'';
    if(url.includes('/api/')){
      const k=getApiKey();
      if(k)init.headers={...(init.headers||{}),'X-API-Key':k};
    }
  }catch(e){}
  return _origFetch(input,init);
};
// POSTs that 5xx/timeout at the proxy return HTML; r.json() then throws
// "JSON.parse: unexpected character at line 1 column 1".
const readJson=async r=>{
  const t=await r.text();
  if(!t)throw new Error('HTTP '+r.status+': empty response');
  try{return JSON.parse(t);}catch(e){
    throw new Error('HTTP '+r.status+': not JSON ('+t.replace(/\s+/g,' ').slice(0,80)+')');
  }
};

// ── helpers ───────────────────────────────────────────────────────────────────
// The dashboard renders ALL times in US Eastern, regardless of where the
// browser is. The trading day is an ET day, so a viewer in IST (or anywhere)
// sees the same clock and the same "today" the bot uses. Do NOT use the
// browser-local getHours()/setHours() for trading time — that made "Today's
// P&L" reset at the viewer's local midnight (showed $0 in India after IST
// midnight while it was still the same ET trading day).
const ET_TZ='America/New_York';
// Calendar date (YYYY-MM-DD) in ET for any Date/ms/iso input.
const etDateStr=d=>{const t=d instanceof Date?d:new Date(d);return isNaN(t)?'':t.toLocaleDateString('en-CA',{timeZone:ET_TZ});};
// Current ET trading day as YYYY-MM-DD.
const todayET=()=>etDateStr(new Date());
const tf=d=>{const t=d instanceof Date?d:new Date();return t.toLocaleTimeString('en-GB',{hour12:false,timeZone:ET_TZ});};
// MM/DD HH:MM:SS (ET) — used by Orders tab so rows can be sorted/disambiguated across days.
const tfd=d=>{const t=d instanceof Date?d:new Date();const ds=t.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',timeZone:ET_TZ});return`${ds} ${t.toLocaleTimeString('en-GB',{hour12:false,timeZone:ET_TZ})}`;};
const ma=m=>tf(new Date(Date.now()-m*60000));
// isFinite(null) is TRUE (Number(null)===0), so `isFinite(n)` alone let nulls
// through: fp(null) threw "can't access property toFixed, n is null" and killed
// the whole React tree — clicking an analyst with a worthless-expiry trade blanked
// the dashboard. fd/f$ didn't throw (Math.abs(null)===0) but rendered a null P&L
// as "+$0", which is worse than an em-dash. Guard on null explicitly.
const f$=n=>n==null||!isFinite(n)?'—':`$${Math.abs(n).toFixed(2)}`;
const fp=n=>n==null||!isFinite(n)?'—':`${n>=0?'+':''}${n.toFixed(1)}%`;
const fd=n=>n==null||!isFinite(n)?'—':`${n>=0?'+':'-'}$${Math.abs(n).toFixed(0)}`;

// ── Fill/reject/stuck notifications: beep + desktop Notification ─────────────
// Per-device opt-in (🔔 in header). new Notification() throws on Android
// Chrome (needs a service worker) — caught, so mobile gets beep-only.
const NOTIF_KEY='relaybot_notify';
let _ac=null;
const _beep=freq=>{try{
  _ac=_ac||new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended')_ac.resume();
  const o=_ac.createOscillator(),g=_ac.createGain();
  o.connect(g);g.connect(_ac.destination);o.frequency.value=freq;
  g.gain.setValueAtTime(.12,_ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+.3);
  o.start();o.stop(_ac.currentTime+.3);
}catch(e){}};
const _notified=new Set(); // one notification per (order, event) per page session
const notifyOnce=(key,title,body,freq)=>{
  if(localStorage.getItem(NOTIF_KEY)!=='1'||_notified.has(key))return;
  _notified.add(key);
  _beep(freq);
  try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body});}catch(e){}
};
// minutes → "Xh Ym" / "Ym" / "Xd Yh" for hold-time display
const fmtDur=m=>{if(!isFinite(m)||m<=0)return'—';const d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=Math.round(m%60);if(d>0)return`${d}d ${h}h`;if(h>0)return`${h}h ${mm}m`;return`${mm}m`;};
const pct=(a,c)=>a&&isFinite(a)?((c/a)-1)*100:0;
const dol=(a,c,r)=>(c-a)*r*100;
// Credit spread: profit as the mark falls. Long-premium helpers above invert it.
const creditDol=(a,c,r)=>(a-c)*r*100;
const creditPct=(a,c,w)=>{const risk=(w||0)-a;return risk>0?((a-c)/risk)*100:0;};
const isCreditOsi=o=>{const p=String(o||'').split('|').filter(Boolean);return p.length===2;};
const isFlyOsi=o=>{const p=String(o||'').split('|').filter(Boolean);return p.length===3;};
const posDol=p=>{
  if(typeof p.pnlDollar==='number'&&isFinite(p.pnlDollar)) return p.pnlDollar;
  const avg=p.avg||p.avgPrice,cur=p.cur||p.currentPrice,cls=p.closePrice,rem=p.rem||p.remaining||0;
  const closed=(p.status||'OPEN')==='CLOSED';
  const px=closed?(cls!=null?cls:cur):cur;
  const n=closed?(p.tot||p.contracts||rem):rem;
  if(!isFinite(avg)||!isFinite(px)) return 0;
  return (p.isCredit||p.is_credit||isCreditOsi(p.osiSymbol||p.osi_symbol))?creditDol(avg,px,n):dol(avg,px,n);
};
const cc=n=>n>0?'var(--green)':n<0?'var(--red)':'var(--muted)';
const tcl=t=>({DISCORD:'bb',PT1:'bg',PT2:'bg',PT3:'bg',SL:'br',MANUAL:'ba',MANUAL_ALL:'br'}[t]||'bd');
// OSI → human: "MRVL260618C00032000" → "MRVL $32C 6/18". Returns raw on no match.
const fmtOsi=o=>{if(!o)return'';const raw=String(o);if(raw.includes('|'))return raw.split('|').filter(Boolean).map(fmtOsi).join(' / ');const m=raw.match(/^([A-Z]+)(\d{2})(\d{2})(\d{2})([CP])(\d{8})$/);if(!m)return raw;const[,r,yy,mm,dd,cp,sk]=m;let s=parseInt(sk,10)/1000;s=Number.isInteger(s)?String(s):s.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');return`${r} $${s}${cp} ${parseInt(mm,10)}/${parseInt(dd,10)}`;};



// ── Badge ─────────────────────────────────────────────────────────────────────
const Bdg=({l,c='bd'})=>React.createElement('span',{className:`badge ${c}`},l);

// ── PctField ──────────────────────────────────────────────────────────────────
// Stepper + typeable number + presets. Deliberately NOT a slider: a slider is
// fast but imprecise, and these are money. The guidance for financial inputs is
// an exact figure you can read and type, with coarse controls beside it — and a
// stepper beats a slider outright for a small range where every increment
// means something. It is also the only one of the three that works with a thumb
// on a 430px phone.
const PctField=({label,value,def_,isOverride,presets,step=5,min=-95,max=500,sign,onChange,onReset,help})=>{
  const [draft,setDraft]=React.useState(String(value));
  React.useEffect(()=>{setDraft(String(value))},[value]);
  const commit=v=>{
    const n=Number(v);
    if(!isFinite(n)){setDraft(String(value));return;}
    const c=Math.max(min,Math.min(max,Math.round(n*10)/10));
    setDraft(String(c));
    if(c!==value)onChange(c);
  };
  const bump=d=>commit((Number(draft)||0)+d);
  return React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:5}},
    React.createElement('div',{style:{display:'flex',alignItems:'baseline',gap:6}},
      React.createElement('span',{style:{fontSize:11,fontWeight:600,color:'var(--text)'}},label),
      React.createElement('span',{style:{fontSize:10,color:'var(--dim)'}},help),
      isOverride
        ?React.createElement('button',{onClick:onReset,style:{marginLeft:'auto',background:'none',
            border:'none',color:'var(--blue)',fontSize:10,cursor:'pointer',padding:0},
            title:`Clear this override and follow the default (${def_>0?'+':''}${def_}%) again`},
            `custom · reset to ${def_>0?'+':''}${def_}%`)
        :React.createElement('span',{style:{marginLeft:'auto',fontSize:10,color:'var(--dim)'}},'default')
    ),
    React.createElement('div',{style:{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}},
      React.createElement('button',{onClick:()=>bump(-step),className:'btn-sm',
        style:{minWidth:32,fontSize:15,lineHeight:1,cursor:'pointer',
          background:'var(--surface)',border:'1px solid var(--border2)',color:'var(--text)'},
        title:`−${step}%`},'−'),
      React.createElement('div',{style:{position:'relative',display:'flex',alignItems:'center'}},
        React.createElement('input',{type:'number',inputMode:'decimal',value:draft,step:step,
          onChange:e=>setDraft(e.target.value),
          onBlur:e=>commit(e.target.value),
          onKeyDown:e=>{if(e.key==='Enter')e.target.blur()},
          style:{width:74,padding:'4px 18px 4px 8px',fontSize:13,fontWeight:600,
            fontFamily:'monospace',textAlign:'right',
            background:'var(--bg)',color:sign==='+'?'var(--green)':'var(--red)',
            border:`1px solid ${isOverride?'var(--blue)':'var(--border)'}`,borderRadius:6}}),
        React.createElement('span',{style:{position:'absolute',right:6,fontSize:11,color:'var(--dim)',

        style:{minWidth:32,fontSize:15,lineHeight:1,cursor:'pointer',
          background:'var(--surface)',border:'1px solid var(--border2)',color:'var(--text)'},
        title:`+${step}%`},'+'),
      ...(presets||[]).map(p=>{const on=Number(draft)===p;
        return React.createElement('button',{key:p,onClick:()=>commit(p),className:'btn-sm',
          style:{fontSize:10,padding:'4px 8px',cursor:'pointer',
            background:on?'var(--bbg)':'transparent',
            border:`1px solid ${on?'var(--blue)':'var(--border2)'}`,
            color:on?'var(--blue)':'var(--muted)'}},
          `${p>0?'+':''}${p}%`)})
    )
  );
};

// ── ExitPlan ──────────────────────────────────────────────────────────────────

// sl_pct straight out of [trading], so a position on a profile was shown numbers

// like a live one. Everything here comes from pos.exitPlan, resolved server-side
// through the same profile stack the monitor uses.
const PLAN_STATE={
  armed:      {bg:'gbg', bd:'gbd', fg:'green', tip:'Will fire when price reaches this level.'},

  off:        {bg:'surface', bd:'border', fg:'muted', tip:'Switched off — will never fire.'},

const ExitPlan=({plan,pos,ptsOff,beOff,trailOn,fallback,onOverride,onTogglePts,onToggleBE,onToggleTrail})=>{

// ── ExitBar ───────────────────────────────────────────────────────────────────
const ExitBar=({pos,slPct=-30,pt1Pct=30,pt2Pct=60,pt3Pct=100,plan=null})=>{
  const p=(typeof pos.pnlPct==='number'&&isFinite(pos.pnlPct))?pos.pnlPct
    :((pos.isCredit||pos.is_credit)?creditPct(pos.avg,pos.cur,pos.spreadWidth||pos.spread_width||0):pct(pos.avg,pos.cur));
  const lo=Math.min(slPct,-10)-5;
  const hi=Math.max(pt3Pct,100)+5;
  const range=hi-lo;
  const tb=v=>Math.max(0,Math.min(100,(Math.max(lo,Math.min(hi,v))-lo)/range*100));
  const cx=tb(p);
  // Plot only what can fire. Drawing a switched-off rung next to a live one
  // made the strip contradict the plan underneath it — a disabled PT2 at +25%
  // sat between an armed PT1 at +50% and a ratcheted stop, which reads as a

// Parse guardrail error reason into [rule, detail] for clean display
// Active-broker display name, updated whenever a config payload arrives (WS
// config_update or the mount fetch). Module-global so leaf components like
// FeedRow — which aren't passed the config object — can render honest broker
// labels instead of a hardcoded "Public.com".
const BROKER_LABELS={public:'Public.com',ibkr:'Interactive Brokers',tradier:'Tradier',lime:'Lime Trader'};
let ACTIVE_BROKER_NAME='Public.com';
function setActiveBrokerFromConfig(c){
  ACTIVE_BROKER_NAME=BROKER_LABELS[(c?.trading?.broker||'public').toLowerCase()]||'Public.com';
}

function parseReason(err){
  if(!err)return[null,null];
  const clean=err.replace(/^Guardrail:\s*/i,'').replace(/^Kelly:\s*/i,'Kelly — ').replace(/^Low confidence:\s*/i,'Scorer — ');
  const colon=clean.indexOf(':');
  if(colon>0){
    const rule=clean.slice(0,colon).trim();
    const detail=clean.slice(colon+1).trim();
    return[rule,detail];
  }
  return[null,clean];
}

// Client-side range filter. `ts` field can be ISO string on alert or order.
// Guards against the server-side filter silently not being applied (e.g. old
// backend version running) and against new items arriving via WebSocket that
// sit outside the selected window.
const _withinRange=(isoTs,days)=>{
  if(!days||days<=0)return true;
  if(!isoTs)return true;  // no timestamp — keep (don't hide)
  const t=Date.parse(isoTs);
  if(isNaN(t))return true;
  if(days===1){
    // Today = the current ET trading day (calendar-day, not rolling 24h,
    // not the viewer's local day).
    return etDateStr(t)===todayET();
  }
  return (Date.now()-t) <= days*86400*1000;
};

  const [statusF,setStatusF]=useState('ALL');
  // Per-analyst scorecard from the loaded orders window (SELL rows carry
  // realized profit). Keyed by the exact author string stamped on orders.
  const aStats={};
  orders.forEach(o=>{

    ...['FILLED','PENDING','BLOCKED','CANCELLED','OTHER'].filter(g=>counts[g])

    const avg=p.avg||p.avgPrice,rem=p.rem||p.remaining||0,d=_pnl$(p);

      :(avg||0)*rem*100;
    if(d>0)o.win++; else if(d<0)o.loss++;
    return o;

  const bookPct=book.cost?book.pnl/book.cost*100:0;

      `realized ${fd(realized)} · ${sellFills} sell fill${sellFills!==1?'s':''}`)
  ),
  React.createElement('div',{style:{overflowX:'auto'}},
  React.createElement('table',{className:'ot'},
    React.createElement('thead',null,
      React.createElement('tr',null,
        ['Time','Symbol','Side','Qty','Limit','Fill','P&L','Trigger','Status',''].map(h=>
          React.createElement('th',{key:h||'actions'},h)
        )
      )
    ),
    React.createElement('tbody',null,
      filtered.map(o=>{
        const side=o.side;
        const fill=o.fill||o.fillPrice;
        const lim=o.lim||o.limitPrice;
        const fc=fill?(side==='BUY'?(fill<lim?'var(--green)':'var(--muted)'):(fill>lim?'var(--green)':'var(--muted)')):'var(--muted)';
        const osi=o.osi||o.osiSymbol||'';
        const t=o.placedAt?tfd(new Date(o.placedAt)):(o.t||'');
        const st=o.status;
        const isPending=st==='PENDING';
        const pendAgeS=(isPending||st==='PARTIALLY_FILLED')&&o.placedAt?Math.floor((Date.now()-new Date(o.placedAt))/1000):null;
        const stuck=pendAgeS!=null&&pendAgeS>=60;
        // submit→fill latency for filled rows
        const latMs=fill&&o.filledAt&&o.placedAt?new Date(o.filledAt)-new Date(o.placedAt):null;
        // CANCELLED SELL displaced by a newer SELL on the same contract within
        // 3min reads as one re-peg chain.
        // ponytail: heuristic osi+time match, O(n²) over ≤500 rows — replace
        // with a real superseded_by column if it ever mislabels.
        const repegged=st==='CANCELLED'&&side==='SELL'&&orders.some(n=>n.id!==o.id&&n.side==='SELL'
          &&(n.osi||n.osiSymbol)===osi&&n.placedAt&&o.placedAt
          &&new Date(n.placedAt)-new Date(o.placedAt)>0&&new Date(n.placedAt)-new Date(o.placedAt)<180000);
        return React.createElement('tr',{key:o.id,className:stuck?'stuck':null,style:isPending&&!stuck?{background:'var(--abg)'}:null,
          title:stuck?`Order pending ${pendAgeS}s — possible stuck re-peg or dead broker session`:null},
          React.createElement('td',{style:{color:'var(--muted)'}},t),
          React.createElement('td',{style:{fontWeight:500,fontSize:11},title:osi},
            React.createElement('span',null,fmtOsi(osi)),
            React.createElement('span',{style:{display:'block',color:'var(--muted)',fontSize:9,fontWeight:400}},osi),
            o.author&&React.createElement('span',{style:{display:'inline-block',marginTop:3,padding:'1px 6px',borderRadius:4,background:'var(--bbg)',border:'1px solid var(--bbd)',color:'var(--blue)',fontSize:9,fontWeight:600,whiteSpace:'nowrap'}},o.author),
            o.strategyTag==='SMALL_ACCT'&&React.createElement('span',{
              title:'Small-account-challenge trade (‼ alert)',
              style:{display:'inline-block',marginTop:3,marginLeft:4,padding:'1px 6px',borderRadius:4,background:'var(--abg)',border:'1px solid var(--abd)',color:'var(--amber)',fontSize:9,fontWeight:700,whiteSpace:'nowrap'}},'‼ SMALL')
          ),
          React.createElement('td',null,React.createElement(Bdg,{l:side,c:side==='BUY'?'bg':'br'})),
          React.createElement('td',null,
            // Show "filled/requested" for partial fills
            o.filledQty&&o.filledQty!==o.quantity
              ?React.createElement('span',null,
                  React.createElement('span',{style:{color:'var(--amber)',fontWeight:600}},o.filledQty),
                  React.createElement('span',{style:{color:'var(--muted)'}},`/${o.qty||o.quantity}`)
                )
              :(o.qty||o.quantity||'—')
          ),
          React.createElement('td',{style:{color:'var(--muted)'}},lim?f$(lim):'—'),
          React.createElement('td',{style:{color:fc}},
            fill?f$(fill):isPending?'awaiting fill…':'—',
            fill&&lim&&Math.abs(fill-lim)>=0.005&&React.createElement('span',{
              style:{display:'block',fontSize:9,color:fc},
              title:'fill − limit (green = price improvement)',
            },`${fill-lim>0?'+':'−'}$${Math.abs(fill-lim).toFixed(2)} vs lim`),
            latMs!=null&&latMs>=0&&React.createElement('span',{
              style:{display:'block',fontSize:9,color:'var(--muted)'},
              title:'submit → fill time',
            },`⚡ ${latMs<1000?Math.round(latMs)+'ms':(latMs/1000).toFixed(1)+'s'}`)
          ),
          // Realized P&L on SELL rows (anchored at cost_basis snapshot taken
          // at fill time). BUY rows and rejected SELLs render as em-dash.
          React.createElement('td',{
            style:{
              color: (o.profit==null) ? 'var(--muted)' : (o.profit>=0?'var(--green)':'var(--red)'),
              fontWeight: 600,
              fontVariantNumeric: 'tabular-nums',
            },
          },
            o.profit==null ? '—' : (o.profit>=0?'+':'')+f$(o.profit),
            // % return on the same cost-basis snapshot the $ figure uses
            !!(o.profit!=null&&o.costBasis&&fill!=null)&&React.createElement('span',{
              style:{display:'block',fontSize:9,fontWeight:500},
              title:'fill vs cost basis',
            },fp(isCreditOsi(o.osiSymbol||o.osi_symbol)?((o.costBasis-fill)/o.costBasis)*100:((fill/o.costBasis)-1)*100))
          ),
          React.createElement('td',null,React.createElement(Bdg,{l:o.trigger,c:tcl(o.trigger)})),
          React.createElement('td',null,
            React.createElement(Bdg,{l:st,c:st==='FILLED'?'bg':st==='PENDING'?'ba':st==='CANCELLED'?'bd':'br'}),
            stuck&&React.createElement('span',{style:{display:'block',fontSize:9,color:'var(--amber)',fontWeight:700,marginTop:2}},`⏳ ${pendAgeS}s`),
            repegged&&React.createElement('span',{
              style:{display:'block',fontSize:9,color:'var(--blue)',fontWeight:600,marginTop:2},
              title:'Cancelled and replaced by a newer SELL on the same contract within 3 min (re-peg chain)',
            },'↻ re-pegged'),
            (st==='REJECTED'||st==='CANCELLED')&&o.error&&React.createElement('span',{
              style:{display:'block',fontSize:9,color:st==='REJECTED'?'var(--red)':'var(--muted)',marginTop:2,maxWidth:160,whiteSpace:'normal'},
              title:o.error,
            },String(o.error).slice(0,70))
          ),
          React.createElement('td',null,
            isPending&&React.createElement('button',{
              className:'btn btn-amber',
              style:{fontSize:10,padding:'2px 8px'},
              disabled:cancelling,
              onClick:()=>onCancel(o.id),
            },'✕ Cancel')
          )
        )
      })
    )
  )
  )
  );
};

// ── STATS tab ─────────────────────────────────────────────────────────────────
const StatsTab=({positions})=>{
  const [data,setData]=useState(null);
  const [period,setPeriod]=useState(30);
  const [loading,setLoading]=useState(false);
  const [grStatus,setGrStatus]=useState(null);
  const [showRules,setShowRules]=useState(false);
  const [analysts,setAnalysts]=useState([]);
  const [openA,setOpenA]=useState(null); // analyst whose trade log is expanded
  const [focus,setFocus]=useState(null); // {zone,label,test} — which number was clicked

  const load=useCallback(async(d)=>{
    setLoading(true);
    try{
      const [statsR, grR, anR] = await Promise.all([
        fetch(`${API}/api/stats?days=${d}`),
        fetch(`${API}/api/guardrails`),
        fetch(`${API}/api/analysts?days=${d}`)
      ]);
      if(statsR.ok) setData(await statsR.json());
      if(grR.ok) setGrStatus(await grR.json());
      if(anR.ok){const j=await anR.json();setAnalysts(j.analysts||[]);}
    }catch(e){console.error('Failed to load stats:',e)}
    finally{setLoading(false)}
  },[]);

  useEffect(()=>{load(period)},[period]);

  const rules=[
    {r:'PT1 — +30% → sell 50%',d:'Half position locked at configured gain %',dot:'var(--green)'},
    {r:'PT2 — +60% → sell 50%',d:'Sell more at higher gain, let rest ride',dot:'var(--green)'},
    {r:'PT3 — +100% → sell remaining',d:'Close remaining at max gain target',dot:'var(--green)'},
    {r:'SL  — configured % → sell all',d:'Stop loss: exit everything at configured loss %',dot:'var(--red)'},
  ];

  if(!data)return React.createElement('div',{className:'empty'},loading?'Loading stats data…':'No data');

  const unre=positions.filter(p=>(p.status||'OPEN')!=='CLOSED').reduce((s,p)=>s+posDol(p),0);
  // Running peak alongside cumulative P&L — the gap between the two lines IS
  // the drawdown, so dips read at a glance without a separate chart.
  let _pk=-Infinity;
  const pnlHistory=(data.pnl_history||[]).map(d=>({...d,peak:_pk=Math.max(_pk,d.pnl)}));
  const lp=pnlHistory.length?pnlHistory[pnlHistory.length-1].pnl:0;
  const lc=lp>=0?'var(--green)':'var(--red)';  // theme token, not hardcoded — light theme uses different green/red

  const winRateColor=wr=>wr>=60?'var(--green)':wr>=50?'var(--amber)':'var(--red)';

  // Every closed trade of the period, already fetched for the analyst bars.
  // Flattening it here is what makes the whole tab clickable without a single
  // extra request.
  const allTrades=analysts.flatMap(a=>(a.trade_log||[]).map(t=>({...t,author:a.author})));
  const pick=(zone,label,test)=>()=>setFocus(f=>(f&&f.label===label)?null:{zone,label,test});
  const drill=zone=>focus&&focus.zone===zone&&React.createElement(TradeDrill,{
    trades:allTrades.filter(focus.test),label:focus.label,onClose:()=>setFocus(null)});
  const isOn=label=>!!(focus&&focus.label===label);
  const todayET=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});

  return React.createElement('div',null,
    // Warning banner when guardrails are disabled
    grStatus && grStatus.guardrails_enabled===false && React.createElement('div',{
      style:{background:'var(--red)',color:'white',padding:'8px 12px',borderRadius:6,marginBottom:12,fontSize:13,fontWeight:500}
    },'⚠️ GUARDRAILS DISABLED - All order protections are OFF'),
    React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:16,flexWrap:'wrap'}},
      React.createElement('span',{style:{fontSize:12,color:'var(--muted)'}},'Period:'),
      ...[1,7,30,90,365].map(d=>
        React.createElement('button',{key:d,className:`btn${period===d?' active':''}`,
          style:{fontSize:11,padding:'4px 10px',
            ...(period===d?{borderColor:'var(--blue)',color:'var(--blue)',background:'var(--bbg)'}:{})
          },
          onClick:()=>setPeriod(d)},d===1?'Today':`${d}d`)
      ),
      loading&&React.createElement('span',{style:{fontSize:11,color:'var(--muted)',marginLeft:8}},'Loading…'),
      // One export instead of three. The old buttons produced three files with
      // no key between them, so "what did this alert actually make" meant
      // matching timestamps by hand across two CSVs. This one joins
      // alert → order → position on a single row, and puts the alerts that
      // produced no order on their own sheet with the reason.
      React.createElement('div',{style:{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}},
        React.createElement('span',{style:{fontSize:10,color:'var(--muted)'}},`${period}d`),
        React.createElement('a',{href:`${API}/api/export/all?days=${period}`,className:'btn',
          style:{fontSize:11,padding:'4px 12px',textDecoration:'none',borderColor:'var(--bbd)',color:'var(--blue)'},
          title:'Excel workbook — Round Trips (buy→sell, FIFO matched), Lifecycle, Not Taken, Summary',
          download:true},'⬇ Export'),
        // Opens in a tab rather than downloading — the report is meant to be
        // read on screen as well as printed, and the browser is the PDF engine.
        React.createElement('a',{href:`${API}/api/report?days=${period}`,className:'btn',
          target:'_blank',rel:'noopener',
          style:{fontSize:11,padding:'4px 12px',textDecoration:'none'},
          title:'Printable report — buy→sell FIFO round trips; open, then Ctrl+P → Save as PDF'},'🖨 Report')
      )
    ),

    // ── Hero: the three P&L numbers that matter, large ────────────────────────
    React.createElement('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,marginBottom:12}},
      ...[
        {l:"Today's P&L",v:fd(data.today_pnl!=null?data.today_pnl:data.total_pnl),c:(data.today_pnl!=null?data.today_pnl:data.total_pnl)>=0?'var(--green)':'var(--red)',
         t:t=>(t.closed_at||'').slice(0,10)===todayET},
        {l:`${data.period_days}d Realized`,v:fd(data.total_pnl),c:data.total_pnl>=0?'var(--green)':'var(--red)',
         t:()=>true},
        {l:'Unrealized (open)',v:fd(unre),c:unre>=0?'var(--green)':'var(--text)'},
      ].map(s=>
        React.createElement('div',{key:s.l,className:'sc',
          onClick:s.t?pick('top',s.l,s.t):undefined,
          role:s.t?'button':undefined,tabIndex:s.t?0:undefined,'aria-expanded':s.t?isOn(s.l):undefined,
          onKeyDown:s.t?e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick('top',s.l,s.t)();}}:undefined,
          style:{padding:'16px 18px',...(s.t?{cursor:'pointer'}:{}),
            ...(isOn(s.l)?{borderColor:'var(--blue)'}:{})}},
          React.createElement('div',{style:{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:6}},s.l),
          React.createElement('div',{className:'mono',style:{fontSize:26,fontWeight:700,color:s.c,lineHeight:1}},s.v)
        )
      )
    ),

    // ── One compact metrics panel (replaces the many scattered cards) ──────────
    React.createElement('div',{style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'4px 4px',marginBottom:14}},
      React.createElement('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(92px,1fr))'}},
        ...[
          {l:'Win Rate',v:`${data.win_rate}%`,c:winRateColor(data.win_rate),t:()=>true},
          {l:'W / L',v:`${data.wins}/${data.losses}`,c:'var(--text)',t:()=>true},
          {l:'Profit Factor',v:data.profit_factor!=null?data.profit_factor.toFixed(2):'—',c:(data.profit_factor||0)>=1.5?'var(--green)':(data.profit_factor||0)>=1?'var(--amber)':'var(--red)',t:()=>true},
          {l:'Expectancy',v:fd(data.expectancy||0),c:cc(data.expectancy||0),t:()=>true},
          {l:'Avg Win',v:data.avg_win?`+$${data.avg_win.toFixed(0)}`:'—',c:'var(--green)',t:t=>(t.pnl||0)>0},
          {l:'Avg Loss',v:data.avg_loss?`-$${data.avg_loss.toFixed(0)}`:'—',c:'var(--red)',t:t=>(t.pnl||0)<=0},
          {l:'Avg Trade',v:fd(data.avg_trade||0),c:cc(data.avg_trade||0),t:()=>true},
          {l:'Max DD',v:data.max_drawdown?`-$${data.max_drawdown.toFixed(0)}`:'—',c:'var(--red)',t:t=>(t.pnl||0)<=0},
          {l:'Avg Hold',v:fmtDur(data.avg_hold_min||0),c:'var(--text)'},
          // Auto/Manual Exits stay inert: trade_log carries no exit-trigger
          // field, so a click could only open a wrong or empty list.
          {l:'Auto Exits',v:data.auto_exits_period,c:'var(--blue)'},
          {l:'Manual Exits',v:data.manual_exits_period,c:'var(--amber)'},
        ].map(s=>
          React.createElement('div',{key:s.l,
            onClick:s.t?pick('top',s.l,s.t):undefined,
            role:s.t?'button':undefined,tabIndex:s.t?0:undefined,'aria-expanded':s.t?isOn(s.l):undefined,
            onKeyDown:s.t?e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick('top',s.l,s.t)();}}:undefined,
            style:{padding:'11px 12px',borderRight:'1px solid var(--border)',borderBottom:'1px solid var(--border)',
              ...(s.t?{cursor:'pointer'}:{}),...(isOn(s.l)?{background:'var(--bbg)'}:{})}},
            React.createElement('div',{style:{fontSize:10,color:'var(--muted)',marginBottom:3,whiteSpace:'nowrap'}},s.l),
            React.createElement('div',{className:'mono',style:{fontSize:16,fontWeight:600,color:s.c}},s.v)
          )
        )
      )
    ),
    drill('top'),

    // ── Best / Worst trade ─────────────────────────────────────────────────────
    React.createElement('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:10,marginBottom:14}},
      ...[
        {l:'🥇 Best Trade', v:data.best_trade.pnl?`+$${data.best_trade.pnl.toFixed(0)}`:'—', osi:data.best_trade.osi, c:'var(--green)'},
        {l:'📉 Worst Trade',v:data.worst_trade.pnl?`-$${Math.abs(data.worst_trade.pnl).toFixed(0)}`:'—', osi:data.worst_trade.osi, c:'var(--red)'},
      ].map(s=>
        React.createElement('div',{key:s.l,className:'sc',
          onClick:s.osi?pick('top',s.l,t=>t.osi===s.osi):undefined,
          role:s.osi?'button':undefined,tabIndex:s.osi?0:undefined,'aria-expanded':s.osi?isOn(s.l):undefined,
          onKeyDown:s.osi?e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick('top',s.l,t=>t.osi===s.osi)();}}:undefined,
          style:{display:'flex',justifyContent:'space-between',alignItems:'center',
            ...(s.osi?{cursor:'pointer'}:{}),...(isOn(s.l)?{borderColor:'var(--blue)'}:{})}},
          React.createElement('div',null,
            React.createElement('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:4}},s.l),
            React.createElement('div',{className:'mono',style:{fontSize:18,fontWeight:600,color:s.c}},s.v)
          ),
          s.osi&&React.createElement('div',{style:{fontSize:11,color:'var(--muted)',fontFamily:'monospace',textAlign:'right',maxWidth:'60%'}},fmtOsi(s.osi))
        )
      )
    ),

    // ── P&L by Analyst — who placed the trades, who made/lost the most ─────────
    (()=>{
      const aS=[...analysts].sort((x,y)=>y.total_pnl-x.total_pnl);
      if(!aS.length)return null;
      const maxAbs=Math.max(1,...aS.map(a=>Math.abs(a.total_pnl)));
      const top=aS[0];
      const worst=aS.reduce((m,a)=>a.total_pnl<m.total_pnl?a:m,aS[0]);
      const tradedMost=[...aS].sort((x,y)=>y.trades-x.trades)[0];
      return React.createElement('div',{style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:16,marginBottom:14}},
        React.createElement('div',{style:{fontSize:12,fontWeight:500,color:'var(--text)',marginBottom:12}},'👤 P&L by Analyst'),
        // callout chips
        React.createElement('div',{style:{display:'flex',gap:10,flexWrap:'wrap',marginBottom:14}},
          React.createElement('div',{style:{flex:'1 1 150px',background:'var(--gbg)',border:'1px solid var(--gbd)',borderRadius:'var(--r)',padding:'8px 12px'}},
            React.createElement('div',{style:{fontSize:10,color:'var(--muted)',marginBottom:2}},'🏆 Top earner'),
            React.createElement('div',{style:{fontSize:13,fontWeight:600,color:'var(--text)'}},top.author),
            React.createElement('div',{className:'mono',style:{fontSize:15,fontWeight:700,color:'var(--green)'}},fd(top.total_pnl))
          ),
          worst.total_pnl<0&&React.createElement('div',{style:{flex:'1 1 150px',background:'var(--rbg)',border:'1px solid var(--rbd)',borderRadius:'var(--r)',padding:'8px 12px'}},
            React.createElement('div',{style:{fontSize:10,color:'var(--muted)',marginBottom:2}},'🔻 Biggest loss'),
            React.createElement('div',{style:{fontSize:13,fontWeight:600,color:'var(--text)'}},worst.author),
            React.createElement('div',{className:'mono',style:{fontSize:15,fontWeight:700,color:'var(--red)'}},fd(worst.total_pnl))
          ),
          React.createElement('div',{style:{flex:'1 1 150px',background:'var(--bbg)',border:'1px solid var(--bbd)',borderRadius:'var(--r)',padding:'8px 12px'}},
            React.createElement('div',{style:{fontSize:10,color:'var(--muted)',marginBottom:2}},'📈 Most active'),
            React.createElement('div',{style:{fontSize:13,fontWeight:600,color:'var(--text)'}},tradedMost.author),
            React.createElement('div',{className:'mono',style:{fontSize:15,fontWeight:700,color:'var(--text)'}},`${tradedMost.trades} trades`)
          )
        ),
        React.createElement('div',{style:{fontSize:10,color:'var(--muted)',marginBottom:6}},
          'Click an analyst to see every trade they placed in this period'),
        // diverging bars: red left / green right of center. Each row toggles
        // the same AnalystDrill the Analysts tab uses — /api/analysts already
        // ships trade_log + by_symbol in this payload, so opening one costs
        // no extra fetch.
        React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:7}},
          ...aS.flatMap(a=>{
            const pos=a.total_pnl>=0;
            const w=Math.abs(a.total_pnl)/maxAbs*50; // % of half-width
            const isOpen=openA===a.author;
            const toggle=()=>setOpenA(isOpen?null:a.author);
            const out=[React.createElement('div',{key:a.author,
                onClick:toggle,
                role:'button',tabIndex:0,
                'aria-expanded':isOpen,
                'aria-label':`${a.author}, ${a.trades} trades — show trade log`,
                onKeyDown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}},
                style:{display:'grid',gridTemplateColumns:'minmax(90px,120px) 1fr 88px',alignItems:'center',gap:8,
                  cursor:'pointer',borderRadius:'var(--r)',padding:'3px 4px',
                  background:isOpen?'var(--bbg)':'transparent'}},
              React.createElement('div',{style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
                React.createElement('span',{style:{color:isOpen?'var(--blue)':'var(--muted)',marginRight:5,fontSize:9,display:'inline-block',transform:isOpen?'rotate(90deg)':'none',transition:'transform .15s'}},'▶'),
                React.createElement('span',{style:{fontSize:12,fontWeight:600,color:'var(--text)'}},a.author),
                React.createElement('span',{style:{fontSize:10,color:'var(--muted)',marginLeft:6}},`${a.trades}t·${a.win_rate}%`)
              ),
              // bar track with center divider
              React.createElement('div',{style:{position:'relative',height:14,background:'var(--bg)',borderRadius:3}},
                React.createElement('div',{style:{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'var(--border2)'}}),
                React.createElement('div',{style:{position:'absolute',top:2,bottom:2,
                  ...(pos?{left:'50%',width:`${w}%`,background:'var(--green)',borderRadius:'0 3px 3px 0'}
                        :{right:'50%',width:`${w}%`,background:'var(--red)',borderRadius:'3px 0 0 3px'})}})
              ),
              React.createElement('div',{className:'mono',style:{fontSize:12,fontWeight:600,color:cc(a.total_pnl),textAlign:'right'}},fd(a.total_pnl))
            )];
            if(isOpen)out.push(React.createElement('div',{key:a.author+'-drill',
              style:{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'12px 14px',margin:'2px 0 8px'}},
              React.createElement(AnalystDrill,{a})
            ));
            return out;
          })
        )
      );

// ── Analyst drill-down (per-stock P&L + trade log) ────────────────────────────
// One drill panel, many triggers. Every closed trade of the period is already
// in memory (analysts[].trade_log), so clicking a number on the Stats tab
// filters that list rather than fetching anything. `focus` carries the zone it
// was opened from so the panel renders next to what was clicked instead of
// jumping the page to a single fixed slot.
const TradeDrill=({trades,label,onClose})=>{
  const [sort,setSort]=useState({k:'closed_at',d:-1});
  const net=trades.reduce((s,t)=>s+(t.pnl||0),0);
  const wins=trades.filter(t=>(t.pnl||0)>0).length;
  const CAP=150;
  const val=(t,k)=>k==='closed_at'?new Date(t.closed_at||0).getTime():(t[k]??0);
  const rows=[...trades].sort((x,y)=>{
    const a=val(x,sort.k),b=val(y,sort.k);
    return typeof a==='string'?sort.d*a.localeCompare(b):sort.d*(a-b);
  }).slice(0,CAP);
  const th=(l,k)=>React.createElement('th',{key:l,
    onClick:k?()=>setSort(s=>s.k===k?{k,d:-s.d}:{k,d:-1}):undefined,
    style:k?{cursor:'pointer',whiteSpace:'nowrap'}:{whiteSpace:'nowrap'}},
    l,k&&sort.k===k?React.createElement('span',{style:{color:'var(--blue)',marginLeft:3}},sort.d<0?'▼':'▲'):null);
  return React.createElement('div',{style:{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'10px 12px',marginBottom:14}},
    React.createElement('div',{style:{display:'flex',alignItems:'baseline',gap:10,flexWrap:'wrap',marginBottom:8}},
      React.createElement('span',{style:{fontSize:12,fontWeight:600,color:'var(--text)'}},label),
      React.createElement('span',{style:{fontSize:11,color:'var(--muted)'}},
        `${trades.length} trade${trades.length===1?'':'s'} · ${wins}W/${trades.length-wins}L · net `),
      React.createElement('span',{className:'mono',style:{fontSize:12,fontWeight:700,color:cc(net)}},fd(net)),
      React.createElement('button',{className:'btn',onClick:onClose,
        style:{marginLeft:'auto',fontSize:11,padding:'2px 9px'}},'✕ close')
    ),
    trades.length===0
      ? React.createElement('div',{style:{fontSize:12,color:'var(--muted)',padding:'6px 2px'}},'No closed trades match.')
      : React.createElement('div',{style:{overflowX:'auto'}},
          React.createElement('table',{className:'ot'},
            React.createElement('thead',null,React.createElement('tr',null,

// Journal note editor for one day. Saves on blur, Ctrl/Cmd+Enter, or the Save
// button, with explicit status feedback (Unsaved → Saving… → Saved ✓ / retry).
// Own component so draft+status reset per day via the parent's key.
const NoteBox=({ds,initial,onSave})=>{
  const [draft,setDraft]=useState(initial||'');
  const [status,setStatus]=useState('idle'); // idle | saving | saved | error
  const dirty=draft.trim()!==(initial||'');
  const save=async()=>{
    if(!dirty||status==='saving')return;
    setStatus('saving');
    setStatus(await onSave(ds,draft)?'saved':'error');
  };
  return React.createElement('div',{style:{marginBottom:12}},
    React.createElement('textarea',{
      value:draft,
      onChange:e=>{setDraft(e.target.value);if(status!=='idle')setStatus('idle');},
      onBlur:save,
      onKeyDown:e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')save();},
      placeholder:'Journal note for this day — setup, mistake, what to repeat…',
      'aria-label':`Journal note for ${ds}`,
      style:{width:'100%',minHeight:60,resize:'vertical',
        padding:'7px 9px',borderRadius:6,border:`1px solid ${status==='error'?'var(--red)':'var(--border)'}`,
        background:'var(--bg)',color:'var(--text)',fontSize:16,
        fontFamily:'inherit',boxSizing:'border-box'}
    }),
    React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10,marginTop:4}},
      React.createElement('button',{className:'btn',disabled:!dirty||status==='saving',
        onClick:save,
        style:{padding:'3px 12px',fontSize:11,opacity:(!dirty||status==='saving')?0.5:1,
          ...(dirty?{borderColor:'var(--blue)',color:'var(--blue)'}:{})}},
        status==='saving'?'Saving…':'Save'),
      React.createElement('span',{style:{fontSize:11,
        color:status==='error'?'var(--red)':status==='saved'?'var(--green)':'var(--muted)'}},
        status==='error'?'⚠ Save failed — tap Save to retry'
        :status==='saved'?'Saved ✓'
        :dirty?'Unsaved changes — Ctrl+Enter or tap Save'
        :(initial?'Saved ✓':'')),
      dirty&&React.createElement('button',{className:'btn',onClick:()=>{setDraft(initial||'');setStatus('idle');},
        style:{marginLeft:'auto',padding:'3px 9px',fontSize:11}},'Revert')
    )
  );
};

// ── CALENDAR / JOURNAL tab ────────────────────────────────────────────────────
// Month grid of realized P&L per ET trading day. Click a day → trade list with
// the opening analyst attributed to each exit. Data: /api/calendar (FILLED SELLs).
const CalendarTab=({})=>{
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);
  // Anchor = first-of-month ET date string the grid is showing.
  const [anchor,setAnchor]=useState(()=>{const[y,m]=todayET().split('-');return`${y}-${m}-01`;});
  const [sel,setSel]=useState(null); // selected YYYY-MM-DD
  const [aFilter,setAFilter]=useState(null); // analyst filter within selected day
  const [notes,setNotes]=useState({}); // YYYY-MM-DD -> journal note

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      // Whole history: total fills are in the low thousands, so paging back a
      // year no longer hits an empty grid because the fetch window ended.
      const r=await fetch(`${API}/api/calendar?days=3650`);
      const j=await r.json();
      setData(j);
      setNotes(j.notes||{});
    }catch(e){console.error('Failed to load calendar:',e)}
    finally{setLoading(false)}
  },[]);
  useEffect(()=>{load()},[]);

  // Persist a note; update local state only on server ack so the 📝 marker
  // and "Saved ✓" never lie. Returns true on success (NoteBox shows status).
  const saveNote=async(ds,txt)=>{
    const t=(txt||'').trim();
    try{
      const r=await fetch(`${API}/api/calendar/note`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({date:ds,note:t})});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      setNotes(n=>{const c={...n};if(t)c[ds]=t;else delete c[ds];return c;});
      return true;
    }catch(e){console.error('Failed to save note:',e);return false;}
  };

  // Index days by date for O(1) cell lookup.
  const byDay={};
  (data?.days||[]).forEach(d=>{byDay[d.date]=d;});

  const [ay,am]=anchor.split('-').map(Number); // year, month(1-12)
  const monthLabel=new Date(ay,am-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDow=new Date(ay,am-1,1).getDay();           // 0=Sun
  const daysInMonth=new Date(ay,am,0).getDate();
  const shiftMonth=n=>{const d=new Date(ay,am-1+n,1);setAnchor(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`);setSel(null);};

  // Month total + win days for the header.
  let mTotal=0,mTrades=0,greenDays=0,redDays=0,tradingDays=0;
  for(let dn=1;dn<=daysInMonth;dn++){
    const ds=`${ay}-${String(am).padStart(2,'0')}-${String(dn).padStart(2,'0')}`;
    const b=byDay[ds];if(!b)continue;
    mTotal+=b.pnl;mTrades+=b.trades;tradingDays++;
    if(b.pnl>0)greenDays++;else if(b.pnl<0)redDays++;
  }
  const winPct=(greenDays+redDays)?Math.round(greenDays/(greenDays+redDays)*100):0;
  const avgDay=tradingDays?mTotal/tradingDays:0;

  const cells=[];
  for(let i=0;i<firstDow;i++)cells.push(null);
  for(let dn=1;dn<=daysInMonth;dn++){
    cells.push(`${ay}-${String(am).padStart(2,'0')}-${String(dn).padStart(2,'0')}`);
  }
  while(cells.length%7!==0)cells.push(null); // pad trailing week
  // Chunk into weeks of 7 + compute each week's realized P&L total.
  const weeks=[];
  for(let i=0;i<cells.length;i+=7){
    const wk=cells.slice(i,i+7);

// Header-mounted dropdown explaining each runtime component and letting the
// user toggle it without hunting through Settings → trading. Hits the same
// /api/config POST endpoint that the Settings tab uses; backend hot-reloads.
function ServicesPanel({configFromWs,open,onClose,push}){
  const cfg=configFromWs||{};
  const dryRun=cfg?.trading?.dry_run==='true';
  const halt=cfg?.trading?.manual_halt==='true';
  const posMon=(cfg?.trading?.position_monitor_enabled??'true')==='true';
  const fwd=(cfg?.trading?.forwarder_enabled??'true')==='true';
  const aiScorer=cfg?.trading?.ai_scorer_enabled==='true';
  const autoExit=cfg?.trading?.auto_exit_enabled==='true';
  // Active-broker display name — keeps the runtime-service titles honest when
  // the active broker is IBKR/Tradier instead of the Public.com default.
  const brokerName=BROKER_LABELS[(cfg?.trading?.broker||'public').toLowerCase()]||'Public.com';
  const [busy,setBusy]=useState(null);

  const flip=async(section,key,nextValue,humanMsg)=>{
    if(!confirm(humanMsg))return;
    setBusy(`${section}.${key}`);
    try{
      const r=await fetch(`${API}/api/config`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify([{section,key,value:String(nextValue)}]),
      });
      if(!r.ok){push&&push(`Toggle failed: HTTP ${r.status}`,'nr');return;}
      push&&push(`${key} → ${nextValue}`,'ng');
    }catch(e){push&&push(`Toggle error: ${e.message||e}`,'nr');}
    finally{setBusy(null);}
  };

  if(!open)return null;

  const row=(opts)=>{
    const {icon,title,desc,on,onLabel,offLabel,danger,onToggle}=opts;
    const busyKey=opts.busyKey;
    const isBusy=busy===busyKey;
    return React.createElement('div',{key:title,style:{
      display:'flex',alignItems:'flex-start',gap:12,padding:'12px 14px',
      borderBottom:'1px solid var(--border)',
    }},
      React.createElement('span',{style:{fontSize:22,lineHeight:1,marginTop:2}},icon),
      React.createElement('div',{style:{flex:1,minWidth:0}},
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
          React.createElement('span',{style:{fontWeight:600,fontSize:13}},title),
          React.createElement('span',{style:{
            fontSize:10,fontWeight:600,padding:'2px 7px',borderRadius:10,
            background:on?(danger?'var(--gbg)':'var(--gbg)'):'var(--abg)',
            color:on?'var(--green)':'var(--amber)',
            border:`1px solid ${on?'var(--gbd)':'var(--abd)'}`,
          }},on?onLabel:offLabel),
        ),
        React.createElement('div',{style:{fontSize:11,color:'var(--muted)',marginTop:3,lineHeight:1.4}},desc),
      ),
      React.createElement('button',{
        className:'btn',disabled:isBusy,onClick:onToggle,
        style:{
          fontSize:11,padding:'5px 12px',minWidth:78,fontWeight:600,
          background:on?'var(--green)':'var(--surface)',
          color:on?'#fff':'var(--text)',
          borderColor:on?'var(--gbd)':'var(--border)',
          opacity:isBusy?0.5:1,
        },
      },isBusy?'…':(on?'ON':'OFF')),
    );
  };

  return React.createElement('div',{
    style:{
      position:'absolute',top:'100%',right:14,marginTop:6,zIndex:50,
      width:480,maxWidth:'calc(100vw - 28px)',
      background:'var(--surface)',border:'1px solid var(--border)',
      borderRadius:8,boxShadow:'0 8px 24px rgba(0,0,0,0.4)',
    },
    onClick:e=>e.stopPropagation(),
  },
    React.createElement('div',{style:{
      padding:'10px 14px',borderBottom:'1px solid var(--border)',
      display:'flex',justifyContent:'space-between',alignItems:'center',
    }},
      React.createElement('span',{style:{fontWeight:600,fontSize:13}},'Runtime services'),
      React.createElement('button',{className:'btn',style:{fontSize:11,padding:'2px 8px'},onClick:onClose},'✕'),
    ),
    row({
      icon:'🛑',title:'Trade execution (new entries)',
      desc:`Places live BUY orders on ${brokerName} when a Discord alert clears the guardrails. Toggle OFF to HALT new entries: nothing is placed and nothing is recorded — no simulated/phantom rows. Open positions can still be exited (manual or analyst SELL). This is the safe "stop trading for today" switch — flip back to LIVE to resume.`,
      on:!halt,onLabel:'LIVE',offLabel:'HALTED',danger:true,
      busyKey:'trading.manual_halt',
      onToggle:()=>flip(
        'trading','manual_halt',!halt?'true':'false',
        !halt
          ?`HALT new trading?\\n\\nNo new BUY orders will be placed and NOTHING will be recorded (no simulated fills). Open positions stay exitable (manual/analyst SELL). Flip back to LIVE to resume.`
          :`Resume LIVE trading?\\n\\nThe bot will place real BUY orders on ${brokerName} again when alerts clear the guardrails. Confirm?`,
      ),
    }),
    row({
      icon:'📈',title:`Position monitor (${brokerName} price polling)`,
      desc:`Polls ${brokerName} every 0.5s for current prices on open positions and evaluates PT/SL/trailing rules. Toggle OFF to stop all ${brokerName} API calls (useful after hours — saves rate limit, but P&L will stop updating and no auto-exits will fire).`,
      on:posMon,onLabel:'POLLING',offLabel:'PAUSED',
      busyKey:'trading.position_monitor_enabled',
      onToggle:()=>flip(
        'trading','position_monitor_enabled',!posMon?'true':'false',
        posMon
          ?`Pause position monitor?\\n\\n${brokerName} price polling will STOP. Open positions will not auto-exit and P&L on the dashboard will freeze. Use OFF only after market close.`
          :`Resume position monitor?\\n\\n${brokerName} price polling will restart at 0.5s intervals.`,
      ),
    }),
    row({
      icon:'🛰️',title:'Discord forwarder (cross-server signal feed)',
      desc:'Relays messages from analyst channels (#analyst-sarang, #pro-alerts, #analyst-tc, etc.) into your local Discord via webhook so the listener can read them. Toggle OFF to stop ingesting NEW signals from analysts (existing positions still managed).',
      on:fwd,onLabel:'ON',offLabel:'STOPPED',
      busyKey:'trading.forwarder_enabled',
      onToggle:()=>flip(
        'trading','forwarder_enabled',!fwd?'true':'false',
        fwd
          ?'Stop the Discord forwarder?\\n\\nNew analyst signals will no longer reach the bot until you flip it back on. Open positions will still be managed.'
          :'Start the Discord forwarder?\\n\\nAnalyst signals will start flowing into the listener again.',
      ),
    }),
    React.createElement('div',{style:{
      padding:'10px 14px',display:'flex',gap:14,fontSize:11,color:'var(--muted)',
    }},
      React.createElement('span',null,`AI scorer: ${aiScorer?'ON':'OFF'}`),
      React.createElement('span',null,`Auto-exit: ${autoExit?'ON':'OFF'}`),
      React.createElement('span',{style:{marginLeft:'auto'}},'Settings tab has the full knob list →'),
    ),
  );
}

      React.createElement('button',{className:'save-btn',id:'settings-save-btn',disabled:!dirty||saving,onClick:save},saving?'Saving…':'💾 Save All Changes'),
      dirty&&!status&&React.createElement('span',{style:{fontSize:12,color:'var(--amber)'}},`${Object.keys(pending).length} unsaved change${Object.keys(pending).length!==1?'s':''}`),
      status&&React.createElement('span',{className:status.ok?'save-status-ok':'save-status-err'},status.msg),
      !dirty&&!status&&React.createElement('span',{style:{fontSize:12,color:'var(--muted)'}},'All settings saved')
    ),

    // ── Change History ──────────────────────────────────────────────────────
