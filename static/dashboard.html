}

function HistoryPanel({refreshTrigger}){
  const [entries,setEntries]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const r=await fetch(`${API}/api/config/history?limit=50`);
      const j=await r.json();
      setEntries(j.entries||[]);
    }catch(e){console.error('History load failed:',e);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{load();},[]);
  // Reload after a successful save
  useEffect(()=>{if(refreshTrigger)load();},[refreshTrigger]);

  return React.createElement('div',{className:'settings-card',style:{marginTop:6}},
    React.createElement('div',{className:'settings-card-title'},
      '📋 Change History',
      React.createElement('span',{style:{marginLeft:'auto',fontSize:11,color:'var(--muted)',fontWeight:400,textTransform:'none'}},
        'logs/config_changes.log'
      )
    ),
    loading
      ? React.createElement('div',{className:'empty',style:{padding:'12px 0'}},'Loading…')
      : entries.length===0
        ? React.createElement('div',{className:'empty',style:{padding:'12px 0',fontSize:12}},'No changes recorded yet. Changes you make here will be logged.')
        : React.createElement('div',{style:{maxHeight:240,overflowY:'auto',fontSize:11,fontFamily:"'SF Mono',monospace"}},
            entries.map((e,i)=>React.createElement('div',{
              key:i,
              style:{padding:'5px 0',borderBottom:'1px solid var(--border)',display:'grid',gridTemplateColumns:'auto 1fr',gap:8,alignItems:'start'}
            },
              React.createElement('div',{style:{color:'var(--muted)',fontSize:10}},e.ts),
              React.createElement('div',null,
                React.createElement('span',{style:{color:'var(--blue)',fontWeight:600}},e.key),
                ' ',
                React.createElement('span',{style:{color:'var(--muted)'}},e.change)
              )
            ))
          ),
    !loading&&entries.length>0&&React.createElement('div',{style:{marginTop:8,textAlign:'right'}},
      React.createElement('button',{
        className:'save-btn',
        style:{background:'var(--surface)',color:'var(--muted)',border:'1px solid var(--border)',fontSize:11,padding:'4px 10px'},
        onClick:load
      },'↻ Refresh')
    )
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
const VALID_TABS=['feed','positions','orders','analysts','calendar','stats','settings'];
function App(){
  // Persist active tab across refreshes via URL hash (+ localStorage fallback)
  const [tab,_setTab]=useState(()=>{
    const h=location.hash.slice(1);
    if(VALID_TABS.includes(h))return h;
    const ls=localStorage.getItem('rb_tab');
    return VALID_TABS.includes(ls)?ls:'feed';
  });
  const setTab=useCallback(t=>{_setTab(t);try{localStorage.setItem('rb_tab',t)}catch(e){}location.hash=t;},[]);
  // Theme (dark/light), per-device. Initialised from the <html data-theme>
  // the head bootstrap already set, so state and DOM agree on first paint.
  const [notifEn,setNotifEn]=useState(()=>{try{return localStorage.getItem(NOTIF_KEY)==='1'}catch(e){return false}});
  const toggleNotif=useCallback(()=>{
    setNotifEn(on=>{
      const next=!on;
      try{localStorage.setItem(NOTIF_KEY,next?'1':'0')}catch(e){}
      if(next){
        try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
        _beep(880); // confirm sound works (also unlocks AudioContext on this gesture)
      }
      return next;});
  },[]);
  const [theme,_setTheme]=useState(()=>document.documentElement.getAttribute('data-theme')||'dark');
  const toggleTheme=useCallback(()=>{
    _setTheme(prev=>{const next=prev==='light'?'dark':'light';
      const el=document.documentElement;
      // Animate all elements together for the flip, then drop the class so
      // nothing transitions during normal use.
      el.classList.add('theme-anim');
      el.setAttribute('data-theme',next);
      clearTimeout(window.__themeT);
      window.__themeT=setTimeout(()=>el.classList.remove('theme-anim'),240);
      try{localStorage.setItem('rb_theme',next)}catch(e){}
      return next;});
  },[]);
  // (A) Sync tab with browser Back/Forward + manual hash edits
  useEffect(()=>{
    const h=()=>{const id=location.hash.slice(1);if(VALID_TABS.includes(id))_setTab(id);};
    addEventListener('hashchange',h);return()=>removeEventListener('hashchange',h);
  },[]);
  // (B) Keep active tab visible in the horizontally-scrolling tab strip (mobile)
  useEffect(()=>{document.getElementById(`tab-${tab}`)?.scrollIntoView({inline:'center',block:'nearest'})},[tab]);
  const [conn,setConn]=useState(false);
  const [alerts,setAlerts]=useState([]);
  const [positions,setPositions]=useState([]);
  const [orders,setOrders]=useState([]);
  const [notifs,setNotifs]=useState([]);
  const [flashId,setFlashId]=useState(null);
  const [exiting,setExiting]=useState(false);
  const [cancelling,setCancelling]=useState(false);
  const [balance,setBalance]=useState({cash:0,buying_power:0,total_value:0});
  const [scoreUpdates,setScoreUpdates]=useState([]);
  const [kellyUpdates,setKellyUpdates]=useState([]);
  const [publicData,setPublicData]=useState(null);
  const [configFromWs,setConfigFromWs]=useState(null);
  const [showClosed,setShowClosed]=useState(false);  // toggle closed positions in Positions tab — hidden by default so active positions stand out
  const [alertRange,setAlertRange]=useState(7);     // days filter for Live Feed tab
  const [orderRange,setOrderRange]=useState(7);     // days filter for Orders tab
  const [servicesOpen,setServicesOpen]=useState(false);
  const [alertRangeLoading,setAlertRangeLoading]=useState(false);
  const [orderRangeLoading,setOrderRangeLoading]=useState(false);
  const wsRef=useRef(null);
  const posRef=useRef(positions);
  posRef.current=positions;
  const ordersRef=useRef(orders);
  ordersRef.current=orders;
  // Stuck-pending watcher: order still PENDING/PARTIALLY_FILLED 60s after
  // placement → one beep+notification. Recent orders only, so a page load
  // over old history can't fire a storm.
  useEffect(()=>{
    const t=setInterval(()=>{
      ordersRef.current.forEach(o=>{
        const age=o.placedAt?Date.now()-new Date(o.placedAt):0;
        if((o.status==='PENDING'||o.status==='PARTIALLY_FILLED')&&age>60000&&age<3600000)
          notifyOnce(`o${o.id}:S`,`⏳ Order stuck: ${o.side} ${fmtOsi(o.osiSymbol||'')}`,`pending ${Math.floor(age/1000)}s — check broker`,550);
      });
    },15000);
    return()=>clearInterval(t);
  },[]);

  const push=useCallback((msg,c='nb')=>{
    const id=Date.now()+Math.random();
    setNotifs(p=>[...p.slice(-4),{id,msg,c}]);
    setTimeout(()=>setNotifs(p=>p.filter(n=>n.id!==id)),5000);
  },[]);

  // ── live WebSocket ──────────────────────────────────────────────────────────
  useEffect(()=>{
    let dead=false;
    // HTTP fallback for positions. The WS `init` is the live source, but if the
    // socket is down (backend redeploy/restart, network blip) the Positions tab
    // would otherwise sit blank even though the data is available over HTTP.
    // Seed on mount + refresh on every disconnect so the list is never empty
    // while reconnecting. WS `init` overwrites with the authoritative snapshot
    // once it arrives. Mirrors init's open + last-8h-closed set.
    const loadPositions=async()=>{
      try{
        const r=await fetch(`${API}/api/positions?include_closed=true`);
        if(r.ok){const d=await r.json();if(Array.isArray(d))setPositions(d);}
      }catch(e){}
    };
    const go=()=>{
      if(dead)return;
      const ws=new WebSocket(WS);
      wsRef.current=ws;
      ws.onopen=()=>{setConn(true);push('Connected to backend','ng')};
      ws.onmessage=e=>{
        const m=JSON.parse(e.data);
        if(m.type==='init'){setPositions(m.data.positions);if(m.data.balance)setBalance(m.data.balance)}  /* alerts+orders load via /api/alerts?days=N + /api/orders?days=N effects */
        else if(m.type==='balance_update'){setBalance(m.data)}
        else if(m.type==='public_account'){setPublicData(m.data)}
        else if(m.type==='alert'){setAlerts(p=>[m.data,...p.slice(0,499)]);setFlashId(m.data.id);setTimeout(()=>setFlashId(null),2000)}
        else if(m.type==='position_update'){
          setPositions(p=>{
            const isClosed=(m.data.status==='CLOSED')||((m.data.remaining||0)<=0);
            const i=p.findIndex(x=>x.id===m.data.id);
            if(isClosed){
              // Keep closed positions in the list so Entry→Exit P&L stays visible
              // They will be filtered by the showClosed toggle in the UI
              if(i>=0){const n=[...p];n[i]=m.data;return n}
              return[...p,m.data];  // newly closed
            }
            if(i>=0){const n=[...p];n[i]=m.data;return n}
            return[...p,m.data];
          })
        }
        else if(m.type==='price_update'){
          setPositions(p=>{
            const i=p.findIndex(x=>x.id===m.data.id);
            if(i<0)return p;
            const n=[...p];
            // _priceUpdatedAt is a client-side wallclock stamp used to render "Xs ago" freshness.
            // If this stops advancing the WS / position_monitor pipeline is stuck.
            n[i]={...n[i],currentPrice:m.data.currentPrice,cur:m.data.currentPrice,highestPrice:m.data.highestPrice,pnlPct:m.data.pnlPct,pnlDollar:m.data.pnlDollar,_priceUpdatedAt:Date.now()};
            return n;
          })
        }
        else if(m.type==='alert_update'){
          // Live status update from executor — update matching alert in state
          setAlerts(p=>{
            const i=p.findIndex(x=>x.id===m.data.id);
            if(i>=0){const n=[...p];n[i]={...n[i],...m.data};return n}
            return p;  // unknown id, ignore
          });
          // Also sync orders list if order status changed (cancel/fill)
          if(m.data.linkedOrderId){
            setOrders(p=>p); // trigger re-render so FeedRow sees updated order
          }
        }
        else if(m.type==='order_update'){
          const o=m.data;
          if(o.status==='FILLED')notifyOnce(`o${o.id}:F`,`✅ Filled: ${o.side} ${fmtOsi(o.osiSymbol||'')}`,`${o.filledQty||o.quantity} @ $${Number(o.fillPrice||0).toFixed(2)}`,880);
          else if(o.status==='REJECTED')notifyOnce(`o${o.id}:R`,`❌ Rejected: ${o.side} ${fmtOsi(o.osiSymbol||'')}`,o.errorText||o.error||'',330);
          setOrders(p=>{const i=p.findIndex(x=>x.id===o.id);if(i>=0){const n=[...p];n[i]=o;return n}return[o,...p]})
        }
        else if(m.type==='auto_exit'){push(m.data.message,m.data.severity==='danger'?'nr':m.data.rule==='MANUAL'||m.data.rule==='MANUAL_ALL'?'na':'ng')}
        else if(m.type==='score_update'){setScoreUpdates(p=>[m.data,...p.slice(0,4)])}
        else if(m.type==='kelly_update'){setKellyUpdates(p=>[m.data,...p.slice(0,4)])}
        else if(m.type==='config_update'){setConfigFromWs(m.data);setActiveBrokerFromConfig(m.data);push('⚙️ Settings updated','nb')}
      };
      ws.onclose=()=>{setConn(false);if(!dead){loadPositions();setTimeout(go,3000)}};
      ws.onerror=()=>ws.close();
    };
    loadPositions();  // seed immediately so the tab isn't blank before WS init
    go();
    // Also fetch from Public.com API periodically
    const fetchPublicData=async()=>{
      try{
        const r=await fetch(`${API}/api/public-account`);
        if(r.ok){
          const data=await r.json();
          if(!data.error){
            setPublicData(data);
            // Update balance with Public.com data
            setBalance({
              cash:data.cash,
              buying_power:data.buying_power,
              options_buying_power:data.options_buying_power,
              total_value:data.total_value,
              today_pnl:data.today_pnl,
            });
          }
        }
      }catch(e){console.error('Public.com fetch failed:',e)}
    };
    fetchPublicData();
    const publicInterval=setInterval(fetchPublicData,30000); // Every 30s
    return()=>{dead=true;wsRef.current?.close();clearInterval(publicInterval)};
  },[push]);

  // ── fetch config on mount so exit bar / pills have real values before any WS config_update ──
  useEffect(()=>{
    fetch(`${API}/api/config`).then(r=>r.json()).then(d=>{setConfigFromWs(d);setActiveBrokerFromConfig(d);}).catch(()=>{});
  },[]);

  // ── refetch alerts when date range changes ─────────────────────────────────
  useEffect(()=>{
    let cancelled=false;
    setAlertRangeLoading(true);
    fetch(`${API}/api/alerts?days=${alertRange}`)
      .then(r=>r.json())
      .then(d=>{if(!cancelled)setAlerts(Array.isArray(d)?d:[])})
      .catch(e=>console.error('alerts fetch failed:',e))
      .finally(()=>{if(!cancelled)setAlertRangeLoading(false)});
    return()=>{cancelled=true};
  },[alertRange]);

  // ── refetch orders when date range changes ─────────────────────────────────
  useEffect(()=>{
    let cancelled=false;
    setOrderRangeLoading(true);
    fetch(`${API}/api/orders?days=${orderRange}`)
      .then(r=>r.json())
      .then(d=>{if(!cancelled)setOrders(Array.isArray(d)?d:[])})
      .catch(e=>console.error('orders fetch failed:',e))
      .finally(()=>{if(!cancelled)setOrderRangeLoading(false)});
    return()=>{cancelled=true};
  },[orderRange]);

  // ── manual exit handlers ────────────────────────────────────────────────────
  const handleExit=useCallback(async(posId)=>{
    if(!window.confirm('Exit this position now? This will submit a live sell order for the remaining contracts.'))return;
    setExiting(true);
    try{
      const r=await fetch(`${API}/api/positions/${posId}/exit`,{method:'POST'});
      const data=await readJson(r);
      if(!r.ok){
        const msg=(data&&data.detail)||'unknown error';
        push(`Exit failed: ${msg}`,'nr');
      }
      else push(data.note
        ?`Exit: ${data.qty} contract(s) for ${data.osi} — ${data.note}`
        :`Exit submitted: ${data.qty} contract(s) for ${data.osi}`,'na');
    }catch(e){push(`Exit error: ${e.message}`,'nr')}
    finally{setExiting(false)}
  },[push]);

  const handleForceClose=useCallback(async(posId)=>{
    if(!window.confirm('Force close this position locally? No broker sell order will be placed. Use this for test/invalid/delisted symbols only.'))return;
    setExiting(true);
    try{
      const r=await fetch(`${API}/api/positions/${posId}/force-close`,{method:'POST'});
      const data=await readJson(r);
      if(!r.ok)push(`Force close failed: ${data.detail}`,'nr');
      else push(`Force closed: ${data.osi} — ${data.note}`,'na');
    }catch(e){push(`Force close error: ${e.message}`,'nr')}
    finally{setExiting(false)}
  },[push]);

  const handleTogglePts=useCallback(async(posId,currentlyOff)=>{
    const verb=currentlyOff?'re-enable PT1/PT2/PT3 (auto-trim)':'disable PT1/PT2/PT3/TPT (let it run — SL still active)';
    if(!window.confirm(`Are you sure you want to ${verb} for this position?`))return;
    try{
      const r=await fetch(`${API}/api/positions/${posId}/toggle-pts`,{method:'POST'});
      const data=await r.json();
      if(!r.ok)push(`Toggle failed: ${data.detail||'unknown'}`,'nr');
      else push(`PTs ${data.pts_disabled?'DISABLED':'enabled'} for ${data.osi}`,'na');
    }catch(e){push(`Toggle error: ${e.message}`,'nr');}
  },[push]);

  const handleToggleBE=useCallback(async(posId,currentlyOff)=>{
    const verb=currentlyOff?'RE-ARM breakeven lock (+20% peak → -1% SL floor)':'DISABLE breakeven lock (keep full configured SL)';
    if(!window.confirm(`${verb} for this position?`))return;
    try{
      const r=await fetch(`${API}/api/positions/${posId}/toggle-breakeven-lock`,{method:'POST'});
      const data=await r.json();
      if(!r.ok)push(`BE lock toggle failed: ${data.detail||'unknown'}`,'nr');
      else push(`BE Lock ${data.breakeven_lock_disabled?'OFF':'ON'} for ${data.osi}`,'na');
    }catch(e){push(`BE lock toggle error: ${e.message}`,'nr');}
  },[push]);

  const handleToggleTrail=useCallback(async(posId,currentlyOn)=>{
    const verb=currentlyOn
      ?'DISARM the trailing stop on this position (back to pure relay — analyst exits only)'
      :'ARM a trailing stop on this position (auto-exits the remainder once it peaks, even though auto-exit is off globally)';
    if(!window.confirm(`${verb}?`))return;
    try{
      const r=await fetch(`${API}/api/positions/${posId}/toggle-trail`,{method:'POST'});
      const data=await r.json();
      if(!r.ok)push(`Trail toggle failed: ${data.detail||'unknown'}`,'nr');
      else push(data.trail_enabled
        ?`Trail ARMED for ${data.osi} — +${Math.round(data.arm_pct)}% arm, ${Math.round(data.trail_pct)}% off peak`
        :`Trail OFF for ${data.osi}`,'na');
    }catch(e){push(`Trail toggle error: ${e.message}`,'nr');}
  },[push]);

  // Per-position exit numbers. No confirm dialog: this changes a threshold, it
  // does not place an order, and a confirm on every stepper tap would make the
  // control unusable. The move is reversible from the same row and lands in
  // exits.log either way.
  const handleExitOverride=useCallback(async(posId,body)=>{
    try{
      const r=await fetch(`${API}/api/positions/${posId}/exit-overrides`,{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await r.json();
      if(!r.ok)push(`Exit settings failed: ${data.detail||'unknown'}`,'nr');
      else if((data.changed||[]).length)push(`${data.osi}: ${data.changed.join(', ')}`,'na');
    }catch(e){push(`Exit settings error: ${e.message}`,'nr');}
  },[push]);

  const handleExitAll=useCallback(async()=>{
    if(!window.confirm('Exit ALL open positions now? This will submit live sell orders for every open contract.'))return;
    setExiting(true);
    try{
      const r=await fetch(`${API}/api/positions/exit-all`,{method:'POST'});
      const data=await readJson(r);
      if(!r.ok)push(`Exit All failed: ${data.detail||'unknown error'}`,'nr');
      else push(`EXIT ALL: ${data.closed}/${data.requested||data.closed} position(s) submitted`,'na');
    }catch(e){push(`Exit All error: ${e.message}`,'nr')}
    finally{setExiting(false)}
  },[push]);

  // ── cancel pending order ────────────────────────────────────────────────────
  const handleCancel=useCallback(async(orderId)=>{
    if(!window.confirm(`Cancel this pending order on ${ACTIVE_BROKER_NAME}?`))return;
    setCancelling(true);
    try{
      const r=await fetch(`${API}/api/orders/${orderId}/cancel`,{method:'POST'});
      const data=await r.json();
      if(!r.ok)push(`Cancel failed: ${data.detail}`,'nr');
      else push(`Order #${orderId} cancelled`,'na');
    }catch(e){push(`Cancel error: ${e.message}`,'nr')}
    finally{setCancelling(false)}
  },[push]);

  // ── cancel alert (by alert ID — server finds the linked order) ───────────────
  // Used by the feed — works even when the order ID isn't in the front-end state
  const handleCancelAlert=useCallback(async(alertId)=>{
    setCancelling(true);
    try{
      const r=await fetch(`${API}/api/alerts/${alertId}/cancel`,{method:'POST'});
      const data=await r.json().catch(()=>({}));
      if(!r.ok){
        push(`Cancel failed: ${data.detail||'server error — check logs'}`,'nr');
      } else {
        const ordMsg=data.order_cancelled?` (order #${data.order_cancelled})`:'';
        push(`Alert #${alertId} cancelled${ordMsg}`,'na');
      }
    }catch(e){push(`Cancel request error: ${e.message}`,'nr');}
    finally{setCancelling(false);}
  },[push]);

  // ── force-resubmit alert (bypass all risk filters) ──────────────────────
  const handleResubmitAlert=useCallback(async(alertId)=>{
    try{
      const r=await fetch(`${API}/api/alerts/${alertId}/resubmit`,{method:'POST'});
      const data=await r.json().catch(()=>({}));
      if(!r.ok){
        push(`Resubmit failed: ${data.detail||'server error — check logs'}`,'nr');
      } else {
        push(`🔁 Override submitted: Alert #${alertId} ${data.osi||''} — all risk filters bypassed`,'nb');
      }
    }catch(e){push(`Resubmit error: ${e.message}`,'nr');}
  },[push]);

  // Split positions so P&L calcs are correct for each group
  const openPositions=positions.filter(p=>(p.status||'OPEN')!=='CLOSED');
  const closedPositions=positions.filter(p=>(p.status||'OPEN')==='CLOSED');
  // Orders badge = in-flight (actionable) count, not total
  const pendingOrders=orders.filter(o=>o.status==='PENDING'||o.status==='PARTIALLY_FILLED').length;

  // Today cutoff: the current ET trading day (matches the bot's ET-midnight
  // boundary, not the viewer's local day — IST viewers were rolling over at
  // IST midnight and seeing $0).
  const _todayET=todayET();
  // Closed TODAY: only positions whose closeTime falls on the ET trading day.
  const todaysClosedPositions=closedPositions.filter(p=>{
    if(!p.closeTime)return false;
    // closeTime from DB is UTC; compare its ET calendar date to today's ET.
    return etDateStr(p.closeTime)===_todayET;
  });

  // Unrealized P&L: open/partial positions using current price
  const unrealizedPnl=openPositions.reduce((s,p)=>s+posDol(p),0);
  // Realized P&L (today only): sum per-leg SELL fills on the ET trading day.
  // Prefer o.profit (API, already credit-aware) then o.costBasis snapshot.
  const realizedPnl=orders.reduce((s,o)=>{
    if(o.status!=='FILLED'||o.side!=='SELL')return s;
    const ts=o.filledAt||o.placedAt;
    if(!ts)return s;
    if(etDateStr(ts)!==_todayET)return s;
    if(typeof o.profit==='number'&&isFinite(o.profit)) return s+o.profit;
    const fp=o.fillPrice;
    const fq=o.filledQty||o.quantity||0;
    if(fp==null||!isFinite(fp)||!fq)return s;
    let basis=o.costBasis||0;
    if(!basis){
      const pos=positions.find(p=>p.osiSymbol===o.osiSymbol);
      basis=pos?(pos.avg||pos.avgPrice||0):0;
    }
    if(!basis)return s;
    const credit=isCreditOsi(o.osiSymbol||o.osi_symbol);
    return s+(credit?(basis-fp)*fq*100:(fp-basis)*fq*100);
  },0);
  const tot=unrealizedPnl+realizedPnl;  // combined session P&L

  return React.createElement('div',{id:'app'},
    // notifs
    React.createElement('div',{className:'nbox'},
      ...notifs.map(n=>React.createElement('div',{key:n.id,className:`notif ${n.c}`},n.msg))
    ),
    // header
    React.createElement('div',{className:'header',style:{position:'relative'}},
      React.createElement('span',{className:'ht',style:{fontSize:24,fontWeight:700,letterSpacing:.3}},'⚡ RelayBot'),
      // API-key setter — required to place/cancel/exit trades & change settings.
      // Stored per-device; clear by submitting an empty value.
      React.createElement('button',{
        className:'btn',
        onClick:()=>{promptApiKey();},
        title:'Set the dashboard API key (needed for trade/exit/config actions). Stored on this device only.',
        style:{padding:'4px 9px',fontSize:12},
      },getApiKey()?'🔑':'🔓'),
      // Notification toggle — per-device beep + desktop alert on fill/reject/stuck.
      React.createElement('button',{
        className:'btn',
        onClick:toggleNotif,
        title:notifEn?'Notifications ON — beep + desktop alert on fills, rejects, stuck orders (this device)':'Notifications OFF — click to enable fill/reject/stuck alerts',
        style:{padding:'4px 9px',fontSize:14,lineHeight:1,opacity:notifEn?1:.45},
      },notifEn?'🔔':'🔕'),
      // Theme toggle — per-device light/dark. Each viewer keeps their own.
      React.createElement('button',{
        className:'btn',
        onClick:toggleTheme,
        title:theme==='light'?'Switch to dark theme (saved on this device)':'Switch to light theme (saved on this device)',
        style:{padding:'4px 9px',fontSize:14,lineHeight:1},
      },theme==='light'?'🌙':'☀️'),
      // WS connection — dashboard ↔ bot websocket (browser side)
      React.createElement('div',{
        style:{display:'flex',alignItems:'center',gap:5},
        title:'WebSocket between this browser and the bot. Green = live updates streaming.',
      },
        React.createElement('span',{className:`dot ${conn?'dot-g':'dot-r'}`}),
        React.createElement('span',{className:'sl'},conn?'Live — connected':'Reconnecting…'),
      ),
      // Services dropdown trigger — replaces the static "Bot running" indicator
      // with a clickable panel that explains each subsystem and lets the user
      // toggle execution / position monitor / forwarder without leaving the
      // top-level view.
      React.createElement('button',{
        className:'btn',
        onClick:()=>setServicesOpen(v=>!v),
        title:'What are these services? Click to see + toggle.',
        style:{
          display:'flex',alignItems:'center',gap:6,
          padding:'4px 10px',fontSize:12,
          background:servicesOpen?'var(--surface)':'transparent',
          borderColor:'var(--border)',
        },
      },
        // Aggregate dot — green if both execution + monitor are healthy, amber otherwise
        (function(){
          const dryRun=configFromWs?.trading?.dry_run==='true';
          const posMon=(configFromWs?.trading?.position_monitor_enabled??'true')==='true';
          const halt=configFromWs?.trading?.manual_halt==='true';
          const allOn=!dryRun&&posMon&&!halt;
          return React.createElement('span',{className:`dot ${allOn?'dot-g':'dot-a'}`});
        })(),
        React.createElement('span',{className:'sl'},'Services'),
        React.createElement('span',{style:{fontSize:10,color:'var(--muted)'}},servicesOpen?'▴':'▾'),
      ),
      React.createElement('div',{style:{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}},
        // Active broker badge — green for Public.com (default), purple for IBKR,
        // orange for Tradier. Lets you see at a glance which vendor is live.
        (function(){
          const b=(configFromWs?.trading?.broker||'public').toLowerCase();
          const ibkrOn=(configFromWs?.ibkr?.orders_enabled||'false')==='true';
          if(b==='ibkr'){
            return React.createElement('span',{
              className:'badge',
              style:{fontSize:11,background:ibkrOn?'#5a2e8c':'#3a2e5c',color:'#ffffff',border:'1px solid #7e57c2'},
              title:ibkrOn?'IBKR active — orders enabled':'IBKR active — orders DISABLED (safety gate off)',
            },ibkrOn?'IBKR':'IBKR (read-only)');
          }
          if(b==='tradier'){
            const tOn=(configFromWs?.tradier?.orders_enabled||'false')==='true';
            const sandbox=(configFromWs?.tradier?.sandbox||'true')==='true';
            const lbl=(tOn?'Tradier':'Tradier (read-only)')+(sandbox?' · sandbox':'');
            return React.createElement('span',{
              className:'badge',
              style:{fontSize:11,background:tOn?'#8c5a2e':'#5c3a2e',color:'#ffffff',border:'1px solid #c2842e'},
              title:tOn?('Tradier active — orders enabled'+(sandbox?' (sandbox)':' (LIVE)')):'Tradier active — orders DISABLED (safety gate off)',
            },lbl);
          }
          if(b==='lime'){
            const lOn=(configFromWs?.lime?.orders_enabled||'false')==='true';
            return React.createElement('span',{
              className:'badge',
              style:{fontSize:11,background:lOn?'#1d4a5c':'#1d3540',color:'#ffffff',border:'1px solid #2e8aa8'},
              title:lOn?'Lime Trader active — orders enabled':'Lime Trader active — orders DISABLED (safety gate off)',
            },lOn?'Lime':'Lime (read-only)');
          }
          return React.createElement('span',{
            className:'badge',
            style:{fontSize:11,background:'#1d3b2a',color:'#7fd99c',border:'1px solid #2e7d4f'},
            title:'Public.com is the active broker',
          },'Public');
        })(),
        configFromWs?.trading?.manual_halt==='true'&&React.createElement('span',{
          className:'badge',
          style:{fontSize:11,fontWeight:700,background:'#5c1d1d',color:'#ff8a8a',border:'1px solid #c23e3e'},
          title:'New entries are HALTED — no BUYs will be placed (exits still work). Flip Services → Trade execution back to LIVE to resume.',
        },'⛔ TRADING HALTED'),
        configFromWs?.trading?.dry_run==='true'&&React.createElement('span',{className:'badge ba',style:{fontSize:11}},'DRY RUN'),
        React.createElement('button',{className:'btn btn-danger',disabled:exiting,onClick:handleExitAll,style:{fontWeight:600}},
          exiting?'Exiting…':'🚨 EXIT ALL'
        ),
      ),
      // The dropdown panel itself, anchored to the header (position: absolute
      // inside the relatively-positioned header div).
      React.createElement(ServicesPanel,{configFromWs,open:servicesOpen,onClose:()=>setServicesOpen(false),push}),
    ),
    // summary bar
    React.createElement('div',{className:'sbar'},
      ...[
        {l:'Account Balance',v:f$(balance.total_value),c:'var(--blue)'},
        {l:'Cash',v:f$(balance.cash),c:'var(--text)'},
        {l:'Options BP',v:f$(balance.options_buying_power||balance.buying_power),c:'var(--text)'},
        {l:'Unrealized P&L',v:fd(unrealizedPnl),c:unrealizedPnl>=0?'var(--green)':'var(--red)'},
        {l:'Realized P&L (today)',v:fd(realizedPnl),c:realizedPnl>=0?'var(--green)':'var(--red)'},  // From Public.com API
        {l:'Open Positions',v:`${openPositions.length} open`,c:'var(--text)'},
        {l:'Orders Filled',v:orders.filter(o=>o.status==='FILLED').length,c:'var(--text)'},
        {l:'Auto-exits',v:orders.filter(o=>['PT1','PT2','PT3','SL'].includes(o.trigger)).length,c:'var(--amber)'},
      ].map(s=>
        React.createElement('div',{key:s.l,className:'si'},
          React.createElement('span',{className:'sl2'},s.l),
          React.createElement('span',{className:'sv',style:{color:s.c}},s.v)
        )
      )
    ),
    // score panel (AI + Kelly updates)
    React.createElement(ScorePanel,{scoreUpdates,kellyUpdates}),
    // tabs
    React.createElement('div',{className:'tabs',role:'tablist','aria-label':'Dashboard sections',onKeyDown:e=>{
      const i=VALID_TABS.indexOf(tab);if(i<0)return;
      let next=null;
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        next=VALID_TABS[(i+(e.key==='ArrowRight'?1:VALID_TABS.length-1))%VALID_TABS.length];
      }else if(e.key==='Home'){next=VALID_TABS[0];}
      else if(e.key==='End'){next=VALID_TABS[VALID_TABS.length-1];}
      if(next){e.preventDefault();setTab(next);requestAnimationFrame(()=>document.getElementById(`tab-${next}`)?.focus());}
    }},
      ...[
        {id:'feed',l:'Live Feed',em:'📡',n:alerts.length},
        {id:'positions',l:'Positions',em:'💼',n:openPositions.length},
        {id:'orders',l:'Orders',em:'🧾',n:orders.length,alert:pendingOrders>0},
        {id:'analysts',l:'Analysts',em:'📊'},
        {id:'calendar',l:'Calendar',em:'📅'},
        {id:'stats',l:'Stats',em:'📈'},
        {id:'settings',l:'Settings',em:'⚙️'},
      ].map(t=>{
        const bdg=t.n==null?null:(t.n>99?'99+':t.n);
        return React.createElement('button',{
          key:t.id,id:`tab-${t.id}`,role:'tab',
          'aria-selected':tab===t.id,'aria-controls':`panel-${t.id}`,tabIndex:tab===t.id?0:-1,
          className:`tab${tab===t.id?' active':''}`,onClick:()=>setTab(t.id)},
          t.em||'',t.em?' ':'',t.l,
          bdg!=null&&React.createElement('span',{className:`tbdg${t.alert?' tbdg-alert':''}`},bdg)
        );
      })
    ),
    // content
    React.createElement('div',{role:'tabpanel',id:`panel-${tab}`,'aria-labelledby':`tab-${tab}`},
    tab==='feed'     &&React.createElement(FeedTab,{
      alerts,flashId,orders,
      onCancelOrder:handleCancel,
      onCancelAlert:handleCancelAlert,
      onResubmit:handleResubmitAlert,
      cancelling,
      range:alertRange,onRangeChange:setAlertRange,loading:alertRangeLoading,
    }),
    tab==='positions'&&React.createElement(PosTab,{
      positions:showClosed?positions:openPositions,
      orders,
      onExit:handleExit,onExitAll:handleExitAll,onForceClose:handleForceClose,onTogglePts:handleTogglePts,onToggleBE:handleToggleBE,onToggleTrail:handleToggleTrail,onOverride:handleExitOverride,exiting,
      showClosed,onToggleClosed:()=>setShowClosed(v=>!v),
      closedCount:closedPositions.length,
      exitConfig:{
        slPct:Number(configFromWs?.trading?.sl_pct||-20),
        pt1Pct:Number(configFromWs?.trading?.pt1_pct||50),
        pt1Sell:Number(configFromWs?.trading?.pt1_sell||0.5),
        pt2Pct:Number(configFromWs?.trading?.pt2_pct||60),
        pt2Sell:Number(configFromWs?.trading?.pt2_sell||0.5),
        pt3Pct:Number(configFromWs?.trading?.pt3_pct||100),
        firstSellClosesAll:(configFromWs?.trading?.first_sell_closes_all==='true'),
        trailArmPct:Number(configFromWs?.trading?.trailing_sl_arm_pct||30),
        trailPct:Number(configFromWs?.trading?.trailing_sl_pct||20),
      },
    }),
    tab==='orders'   &&React.createElement(OrdTab,{orders,onCancel:handleCancel,cancelling,range:orderRange,onRangeChange:setOrderRange,loading:orderRangeLoading}),
    tab==='signals'  &&React.createElement(SignalsTab,{}),
    tab==='analysts' &&React.createElement(AnalystsTab,{}),
    tab==='calendar' &&React.createElement(CalendarTab,{}),
    tab==='stats'    &&React.createElement(StatsTab,{positions}),
    tab==='settings' &&React.createElement(SettingsTab,{configFromWs})
    )
  )
}

createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
