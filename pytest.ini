[pytest]
testpaths = tests
asyncio_mode = auto
# Put the repo root on sys.path so `import app...` resolves regardless of how
# pytest is invoked. Bare `pytest tests/test_perf.py` (CI perf stage) doesn't
# add cwd the way `python -m pytest` does, so a single-file run was failing
# collection with ModuleNotFoundError: No module named 'app'.
pythonpath = .
