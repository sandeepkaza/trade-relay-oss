name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Hosted runners only. Never point a public repo at a self-hosted runner:
# fork PRs would execute on the box that holds your broker credentials.
permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff bandit
      - run: pytest tests/ -q --ignore=tests/test_perf.py
      - run: ruff check app scripts --select E9,F,B
        continue-on-error: true
      - run: bandit -r app -lll
