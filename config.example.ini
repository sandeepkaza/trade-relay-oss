; ============================================================================
;  TradeRelay — minimal config.  Copy to config.ini:  cp config.example.ini config.ini
;
;  Secrets (tokens, API keys, account numbers) go in .env, NOT here.
;  Almost every trading knob has a sensible built-in default, so this file only
;  needs the few things the app can't guess. Add more keys from the README's
;  full [trading]/[guardrails] reference when you want to tune behavior — any
;  key you omit falls back to its default.
; ============================================================================

[discord]
; Channel ID(s) the bot watches for alerts (comma-separated). REQUIRED.
; Right-click a channel in Discord (Developer Mode on) → Copy Channel ID.
channel_ids =
; Only act on messages from these author names (blank = all authors).
authors =

[trading]
; Active broker: public | ibkr | tradier | lime  (must match BROKER in .env)
broker = public
; Per-position price history → logs/prices.jsonl (one JSON object per line).
; ON by default. Samples every open position every N seconds from entry to
; exit, on every broker. Observability only — changes no exit behavior.
; Splits at [logging] price_max_file_size_mb into prices.jsonl.YYYYmmdd-HHMMSS
; and is NEVER pruned — raw material for MAE / stop-width analysis, which
; needs months of history. The monitor has no market-hours gate, so multi-day
; positions are sampled overnight and at weekends too: ~2.9 MB/day at 5 open
; positions (~1 GB/year), a 25 MB roll about every 9 days. Nothing deletes it.
; price_track_enabled = true
; price_track_interval_seconds = 30
; START HERE: true = simulate only, no real orders. Flip to false when ready.
dry_run = true
; Chase the fill on stop-class auto exits (SL / TRAILING_SL / TPT / TIME_EXIT).
; OFF = legacy behaviour: the exit is placed once at mark x (1 - sell_slippage)
; and never re-pegged, so on a fast move it goes stale and the stop silently
; doesn't happen. ON reuses the close_all re-peg ladder (bid - 1 tick every
; close_all_repeg_seconds, then a marketable final attempt), lets any newer
; exit displace an AUTO order left unfilled past auto_exit_stale_seconds, and
; re-arms a stop whose order died with no fill. Only matters when
; auto_exit_enabled = true. See docs/EXIT_ENGINE_HARDENING.md.
; auto_exit_repeg_enabled = false
; auto_exit_stale_seconds = 10
; Measure the stop against the bid instead of the mid. Every quote the monitor
; sees is (bid+ask)/2, but a SELL fills at the bid — so on a $2.00 contract with
; a $0.50 spread a stop reading "-20%" actually realises about -32%. Profit
; targets stay on the mid either way. OFF = legacy mid comparison.
; sl_use_bid_enabled = false
; Cap on wide_spread_skip_sl_pct. That guard defers the stop while the spread is
; wide, but wide spreads and fast moves are the same event, so an unbounded
; defer deletes the stop in the only session where it matters. N = fire anyway
; after N consecutive deferred ticks. 0 = legacy, defer forever.
; wide_spread_max_defer_ticks = 0
; Alarm when an open position gets no quote for N consecutive polls during
; market hours — it has no stop and no target while that lasts. 0 = off.
; quote_gap_alarm_ticks = 120
; Contracts per trade when an alert has no explicit size.
size_default = 1
; true = ignore any contract count stated in the alert text; always size from
; size_default / size tags.
; ignore_message_qty = false
; Exception to the line above: comma-separated author substrings whose
; small-account alerts (marked "‼" or "small account") DO use the stated
; count. Empty = off. e.g. message_qty_authors = Sniper
; message_qty_authors =

; ── Vertical credit spreads (Tradier only) ───────────────────────────────────
; Off by default. When enabled, the listed channels are parsed ONLY as credit
; spreads ("OPENED: CCS SPX 7390/95 $1.25 x3") and never as single-leg alerts.
; spreads_enabled = false
; Dedicate this instance to spreads: true refuses every single-leg BUY.
; Needed because the spread analyst also posts single-leg alerts in other
; forwarded rooms, which an author whitelist cannot separate. SELLs still
; fill so anything already held stays exitable.
; spreads_only = false
; spread_channel_ids =
; Cap on what ONE spread may lose: (width - credit) x 100 x contracts. A 5-wide
; SPX spread taken for $1.25 risks $375 a contract, so 400 allows exactly one.
; This is the real exposure — the credit received is not.
; NOTE this is loss, not collateral: Tradier reserves the FULL width ($500 on a
; 5-wide) as margin per contract, so option_buying_power / 500 is the hard
; ceiling on contracts regardless of what you set here.
; spread_max_risk_dollars = 400
; spread_max_contracts = 1

; ── Butterflies (same channels, same Tradier lane) ───────────────────────────
; Off by default and gated on spreads_enabled as well, so this is a second
; switch rather than a replacement. When off, a fly alert parses to nothing and
; is treated as chatter — exactly the behaviour before flies were understood.
;   OPENED: SPX 10W FLY 7790/7800/7810 $1.80
;   OPENED: SPX 7600 10W FLY $2.0 x2            (body then width, live 2026-09-10)
;   CLOSED: SPX 10W 7800 FLY $4.15 ALL OUT      (body-only spelling, both live)
; "10W" is the WING distance (7800 +/- 10), not the total span.
; A fly is a DEBIT structure: it is bought to open and sold to close, and its
; max loss is the whole debit paid — so spread_max_risk_dollars = 400 allows a
; fly costing up to $4.00, not one whose width is 4 points.
; spread_flies_enabled = false
; Calls or puts. The alert never says which, so this is a config decision, not
; a parse. The analyst's own explainer for this structure describes puts
; ("selling 2 7800 puts, buy 1 7790p, buy 1 7810p"), hence P.
; spread_fly_right = P

; ── Lime Trader (broker = lime) ──────────────────────────────────────────────
; Credentials live in .env (LIME_USERNAME / LIME_PASSWORD / LIME_CLIENT_ID /
; LIME_CLIENT_SECRET / LIME_ACCOUNT_NUMBER) — never here, and never editable
; from the portal. Auth is an OAuth2 password grant, so the account password
; itself is one of the secrets.
;
; ⚠ Lime has NO sandbox host. Demo and live accounts are both served by
;   https://api.lime.co, so unlike Tradier there is no sandbox=true to hide
;   behind: LIME_ACCOUNT_NUMBER is the only thing separating paper from real
;   money. Confirm the account number before flipping orders_enabled.
;
; ⚠ Lime supports market and limit orders ONLY — no stop, no stop-limit, no
;   OCO. Nothing that expects a broker-side stop works under this broker.
;
; [lime]
; orders_enabled = false          ; second half of the two-step opt-in; one-knob revert
; validate_before_order = false   ; extra REST RTT before every place; leave off
; fill_poll_interval_seconds = 0.2  ; first poll is immediate; this is the repeat interval
; block_buy_without_quote = true  ; refuse a BUY Lime can't quote (OPRA token not activated
;                                 ; today → 403); false = bid blind off the alert price
; feed_wait_max_seconds = 2       ; max wait for an account-feed frame before the monitor
;                                 ; re-quotes over REST (quiet contracts badged DEAD at 10s); 30 = old
; account_number =                ; prefer LIME_ACCOUNT_NUMBER in .env

; ── Auto-exit (all optional; these ARE the built-in defaults) ────────────────
; Derived from 711 real lots, not picked by feel — docs/EXIT_ENGINE_HARDENING.md
; carries the sweep and the two modelling traps behind it. One copy of these
; numbers lives in app/core/profile_resolver.py (EXIT_DEFAULTS); everything
; below only restates it. A key set here, or in a [profile:*] section, wins.
;
; None of it fires until auto_exit_enabled = true, which is off by design —
; the bot is a relay and the analyst drives entries and exits.
; auto_exit_enabled = false
;
; One profit rung, half the position at +50%. The rungs are CHAINED (PT2 needs
; PT1 to have fired, PT3 needs PT2, the trail needs PT1), so a single rung has
; to sit on PT1 — moving pt3_pct to 50 with pt1 off disables everything.
; pt1_enabled = true
; pt1_pct = 50
; pt1_sell = 0.5
; pt2_enabled = false
; pt3_enabled = false
; tpt_enabled = false           ; can never arm once pt3 is off
;
; Stop. -20% was the single largest contributor in the sweep.
; sl_enabled = true
; sl_pct = -20
;
; Trailing stop: +$10,610. Arms at +30% (grid tie 25/30, and 80% of the median
; winner's MFE), gives back 20% of the peak — the p75 of what armed winners
; actually gave back, so it engages on real round-trips instead of on noise.
; The width is NOT derivable from the sweep: the model only trails a lot that
; ENDED below the trail, so it is never whipsawed and tighter always "wins".
; trailing_sl_enabled = true
; trailing_sl_arm_pct = 30
; trailing_sl_pct = 20
;
; Breakeven lock: +$7,164, 86 lots rescued from round-tripping into a loss.
; Arm +15 / floor +5 sits at the constrained optimum. A floor must stay strictly
; BELOW its own arm — the unconstrained grid picks floor +15 over arm +10, which
; the market cannot do; the model teleports to the floor with no path cost.
; breakeven_lock_enabled = true
; breakeven_lock_arm_pct = 15
; breakeven_lock_floor_pct = 5
;
; The PT2/PT3 floor locks are OFF. They ratchet sl_pct to a POSITIVE number
; once the peak clears pt2_pct/pt3_pct, so they sell at a profit under an "SL"
; label even with every pt*_enabled = false — and with one rung at +50 a lock
; defaulting to pt1_pct puts the stop above the current price.
; pt2_floor_lock_enabled = false
; pt3_floor_lock_enabled = false
;
; See README → Configuration for the full list.

[guardrails]
; Safety limits on NEW entries (exits always work regardless).
max_open_positions = 5
max_daily_loss = 200
market_hours_only = true
